<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Stickers - Far</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Bangers', cursive;
            background: #0d0d0d;
            color: white;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .gradient-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 0, 128, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 255, 0.2) 0%, transparent 50%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .content {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 16rem;
            line-height: 0.9;
            letter-spacing: 8px;
        }

        .word1 {
            display: block;
            background: linear-gradient(90deg, #ff0080, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .word2 {
            display: block;
            background: linear-gradient(90deg, #00ffff, #00ff80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .price {
            font-size: 7rem;
            color: #fff;
            margin-top: 30px;
        }

        .price span {
            color: #ff0080;
        }

        .tagline {
            font-size: 2.5rem;
            color: #666;
            letter-spacing: 6px;
            margin-top: 20px;
            font-family: sans-serif;
        }

        .branding {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            letter-spacing: 5px;
            color: #444;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="content">
        <h1>
            <span class="word1">VINYL</span>
            <span class="word2">STICKERS</span>
        </h1>
        <div class="price">FROM <span>$3</span></div>
        <div class="tagline">WATERPROOF • DIE-CUT • CUSTOM</div>
    </div>
    <div class="branding">BLUE RIDGE CUSTOM CO</div>
</body>
</html>

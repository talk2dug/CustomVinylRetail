<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Showcase - Categories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./theme.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
      font-family: 'Inter', sans-serif;
      color: white;
      overflow-x: hidden;
    }

    /* Animated background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: orbFloat 20s ease-in-out infinite;
    }

    .bg-orb:nth-child(1) {
      width: 600px;
      height: 600px;
      background: rgba(100, 50, 180, 0.15);
      top: -200px;
      left: -100px;
      animation-delay: 0s;
    }

    .bg-orb:nth-child(2) {
      width: 500px;
      height: 500px;
      background: rgba(50, 100, 200, 0.12);
      bottom: -150px;
      right: -100px;
      animation-delay: -5s;
    }

    .bg-orb:nth-child(3) {
      width: 400px;
      height: 400px;
      background: rgba(150, 50, 150, 0.1);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(50px, -30px) scale(1.1); }
      50% { transform: translate(-30px, 50px) scale(0.95); }
      75% { transform: translate(-50px, -20px) scale(1.05); }
    }

    /* Header */
    .header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 80px 20px 40px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.6);
      font-weight: 300;
      letter-spacing: 0.1em;
    }

    /* Main content */
    .main {
      position: relative;
      z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* All artwork card */
    .all-artwork-card {
      display: block;
      background: linear-gradient(135deg, rgba(150, 100, 255, 0.2) 0%, rgba(100, 150, 255, 0.15) 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      text-decoration: none;
      color: white;
      margin-bottom: 60px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .all-artwork-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .all-artwork-card:hover {
      transform: translateY(-5px);
      border-color: rgba(150, 100, 255, 0.4);
      box-shadow: 0 20px 60px rgba(100, 50, 150, 0.2);
    }

    .all-artwork-card:hover::before {
      opacity: 1;
    }

    .all-artwork-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 12px;
      position: relative;
    }

    .all-artwork-card p {
      color: rgba(255,255,255,0.6);
      font-size: 1rem;
      position: relative;
    }

    .all-artwork-card .arrow {
      display: inline-block;
      margin-left: 10px;
      transition: transform 0.3s ease;
    }

    .all-artwork-card:hover .arrow {
      transform: translateX(5px);
    }

    /* Section title */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 30px;
      padding-left: 20px;
      border-left: 3px solid rgba(150, 100, 255, 0.6);
    }

    /* Category grid */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    /* Category card */
    .category-card {
      position: relative;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: white;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .category-card:hover {
      transform: translateY(-8px);
      border-color: rgba(150, 100, 255, 0.3);
      box-shadow: 0 25px 80px rgba(0,0,0,0.4);
    }

    .category-preview {
      position: relative;
      height: 200px;
      background: rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .category-preview-images {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 100%;
    }

    .category-preview-images img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      transition: all 0.4s ease;
    }

    .category-card:hover .category-preview-images img {
      opacity: 1;
      transform: scale(1.05);
    }

    .category-preview-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
    }

    .category-info {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .category-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .category-count {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .category-action {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(150, 100, 255, 0.9);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .category-action svg {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }

    .category-card:hover .category-action svg {
      transform: translateX(5px);
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.6);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: rgba(150, 100, 255, 0.8);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }

    .empty-state h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .empty-state p {
      color: rgba(255,255,255,0.5);
    }

    /* Fullscreen button */
    .start-fullscreen {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 100;
      background: linear-gradient(135deg, rgba(150, 100, 255, 0.8) 0%, rgba(100, 150, 255, 0.8) 100%);
      border: none;
      border-radius: 50px;
      padding: 16px 32px;
      color: white;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 40px rgba(100, 50, 150, 0.4);
    }

    .start-fullscreen:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 50px rgba(100, 50, 150, 0.5);
    }

    .start-fullscreen svg {
      width: 20px;
      height: 20px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 60px 20px 30px;
      }

      .category-grid {
        grid-template-columns: 1fr;
      }

      .all-artwork-card {
        padding: 30px 20px;
      }

      .start-fullscreen {
        bottom: 20px;
        right: 20px;
        padding: 14px 24px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a href="./" class="logo"><div class="logo-icon"><i class="fas fa-bolt"></i></div><div><span>BlueRidgeCustomCo</span><span class="logo-sub">Premium Custom Designs</span></div></a>
    <nav class="nav-desktop">
      <a href="./catalog.html">Catalog</a><a href="./racing.html">Racing</a><a href="./designer.html">Designer</a><a href="https://store.swayzecustomvinyl.com/apparel.html">Apparel</a><a href="./customer.html" class="nav-cta">My Account</a>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</header>
<div class="nav-mobile-overlay" id="mobileNav">
  <a href="./catalog.html">Catalog</a><a href="./racing.html">Racing</a><a href="./designer.html">Designer</a><a href="https://store.swayzecustomvinyl.com/apparel.html">Apparel</a><a href="./customer.html">My Account</a>
</div>
  <div class="bg-animation">
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
  </div>

  <header class="header">
    <h1>Art Showcase</h1>
    <p>Beautiful artwork on display</p>
  </header>

  <main class="main">
    <a href="art-showcase.html" class="all-artwork-card">
      <h2>View All Artwork <span class="arrow">&rarr;</span></h2>
      <p>Browse the complete collection in fullscreen</p>
    </a>

    <h2 class="section-title">Browse by Category</h2>

    <div id="categoryGrid" class="category-grid">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading categories...</p>
      </div>
    </div>
  </main>

  <button class="start-fullscreen" onclick="window.location.href='art-showcase.html'" title="Start Fullscreen Slideshow">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    Start Slideshow
  </button>

  <script>
    const API_KEY = 'laZHEthV92qDq0adO07UnqoH3O4baZmV';

    function getImageUrl(art) {
      // Use filePath only - previews may not exist for newer uploads
      const path = art.filePath;
      if (!path) return '';
      // Ensure absolute path starting with /library/
      if (path.startsWith('/')) return path;
      if (path.startsWith('library/')) return '/' + path;
      return '/library/' + path;
    }

    async function loadCategories() {
      const grid = document.getElementById('categoryGrid');
      const headers = { 'x-api-key': API_KEY };

      try {
        // Fetch categories
        const catResponse = await fetch('/api/custom-art/artwork/categories', { headers });
        if (!catResponse.ok) throw new Error('Failed to load categories');
        const catData = await catResponse.json();
        const categories = catData.categories || [];

        if (!categories || categories.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <h3>No Categories Found</h3>
              <p>Add some artwork to get started</p>
            </div>
          `;
          return;
        }

        // Fetch artwork for previews (get all active artwork)
        const artResponse = await fetch('/api/custom-art/artwork?limit=1000&status=active', { headers });
        const artData = await artResponse.json();
        const allArtwork = artData.artwork || artData || [];
        console.log('[Art Showcase] Loaded', allArtwork.length, 'artworks');

        // Group artwork by category
        const artworkByCategory = {};
        allArtwork.forEach(art => {
          const cat = art.category || 'Uncategorized';
          if (!artworkByCategory[cat]) artworkByCategory[cat] = [];
          artworkByCategory[cat].push(art);
        });

        // Build category cards - only show categories that have artwork
        grid.innerHTML = categories
          .filter(category => {
            const categoryArt = artworkByCategory[category] || [];
            return categoryArt.length > 0;
          })
          .map(category => {
          const categoryArt = artworkByCategory[category] || [];
          const count = categoryArt.length;
          const previewImages = categoryArt.slice(0, 3);

          return `
            <a href="art-showcase.html?category=${encodeURIComponent(category)}" class="category-card">
              <div class="category-preview">
                <div class="category-preview-images">
                  ${previewImages.map(art => `
                    <img src="${getImageUrl(art)}"
                         alt="${art.title || ''}"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23333%22 width=%22100%22 height=%22100%22/></svg>'">
                  `).join('')}
                  ${previewImages.length < 3 ? Array(3 - previewImages.length).fill(`
                    <div style="background: rgba(0,0,0,0.5);"></div>
                  `).join('') : ''}
                </div>
                <div class="category-preview-overlay"></div>
              </div>
              <div class="category-info">
                <h3 class="category-name">${category}</h3>
                <p class="category-count">${count} artwork${count !== 1 ? 's' : ''}</p>
                <div class="category-action">
                  View Collection
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                  </svg>
                </div>
              </div>
            </a>
          `;
        }).join('');

      } catch (error) {
        console.error('Error loading categories:', error);
        grid.innerHTML = `
          <div class="empty-state">
            <h3>Error Loading Categories</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    loadCategories();
  </script>
<script src="./theme.js"></script>
</body>
</html>

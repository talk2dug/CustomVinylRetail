<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2B Metal Prints Portal - Login</title>
  <link rel="stylesheet" href="b2b.css">
</head>
<body class="b2b-login-page">
  <div class="b2b-login-card">
    <div class="b2b-login-header">
      <div class="b2b-logo-icon" style="width: 60px; height: 60px; font-size: 1.5rem; margin: 0 auto 1rem;">MP</div>
      <h1>Metal Prints Portal</h1>
      <p>Sign in to your B2B account</p>
    </div>

    <div id="loginError" class="b2b-login-error"></div>

    <form id="loginForm">
      <div class="b2b-form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="you@company.com" autocomplete="email">
      </div>
      <div class="b2b-form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Your password" autocomplete="current-password">
      </div>
      <button type="submit" class="b2b-btn b2b-btn-primary b2b-btn-block" id="loginBtn">
        Sign In
      </button>
    </form>

    <p class="text-center text-muted text-small mt-2">
      Need access? Contact your account representative.
    </p>
  </div>

  <script src="b2b.js"></script>
  <script>
    // Check if already logged in
    B2B.init();
    if (B2B.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    // Handle login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');

      btn.disabled = true;
      btn.innerHTML = '<span class="b2b-loading"></span> Signing in...';
      errorEl.style.display = 'none';

      try {
        await B2B.login(email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel Studio — Blue Ridge Custom Co</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Montserrat:wght@400;600;700;900&display=swap">
  <style>
    :root {
      --bg: #0b1020;
      --surface: #151b33;
      --surface-2: #1d2443;
      --border: #2a3256;
      --text: #e7ebf5;
      --muted: #8a93ab;
      --accent: #ff6b35;
      --accent-2: #ffa95c;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }
    header h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    header .brand { color: var(--accent); }
    header .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }
    header .back:hover { color: var(--text); }

    .layout {
      display: grid;
      grid-template-columns: 380px 1fr 340px;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* ── Left: Asset Browser ── */
    .browser {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 14px 10px;
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .browser-filters {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .browser-filters input, .browser-filters select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 6px;
      min-width: 0;
    }
    .browser-filters input:focus, .browser-filters select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .asset-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-content: start;
    }
    .asset-card {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      height: 420px;
      position: relative;
      transition: all .15s;
    }
    .asset-card:hover {
      border-color: var(--accent-2);
      transform: translateY(-1px);
    }
    .asset-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent);
    }
    .asset-card img, .asset-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .asset-card .label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      color: white;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .asset-card .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--accent);
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .asset-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .load-more {
      grid-column: 1 / -1;
      padding: 12px;
      background: var(--surface-2);
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }
    .load-more:hover { color: var(--text); border-color: var(--accent); }

    /* ── Center: Workspace ── */
    .workspace {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .workspace-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .workspace-header h2 {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .workspace-header .count {
      font-size: 13px;
      color: var(--accent);
      font-weight: 700;
    }
    .selected-strip {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      overflow-x: auto;
      min-height: 120px;
      align-items: center;
    }
    .selected-strip::-webkit-scrollbar { height: 6px; }
    .selected-strip::-webkit-scrollbar-track { background: var(--surface); }
    .selected-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .selected-item {
      position: relative;
      width: 90px;
      height: 90px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: all .15s;
    }
    .selected-item:hover { border-color: var(--accent-2); }
    .selected-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent), 0 4px 20px rgba(255, 107, 53, 0.4);
      transform: translateY(-2px);
    }
    .selected-item .effect-badge {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2px 4px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 9px;
      font-weight: 700;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      white-space: nowrap;
    }
    .selected-item .caption-preview {
      position: absolute;
      top: 26px;
      left: 2px;
      right: 2px;
      padding: 3px 4px;
      background: rgba(255, 107, 53, 0.92);
      color: white;
      font-size: 9px;
      font-weight: 900;
      text-align: center;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .selected-item img, .selected-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .selected-item .order {
      position: absolute;
      top: 4px;
      left: 4px;
      background: var(--accent);
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .selected-item .remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.7);
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .selected-item .remove:hover { background: var(--danger); }
    .selected-empty {
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
    }

    .preview-area {
      flex: 1;
      min-height: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #preview-container {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-placeholder {
      width: 240px;
      aspect-ratio: 9/16;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }
    .preview-placeholder .icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .preview-video {
      max-height: 100%;
      max-width: 100%;
      height: auto;
      width: auto;
      aspect-ratio: 9/16;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      display: block;
    }
    .preview-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .preview-tab {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .preview-tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .preview-tab:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .canvas-preview {
      position: relative;
      max-height: 100%;
      height: min(100%, 600px);
      aspect-ratio: 9/16;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
      display: block;
    }
    .canvas-preview .canvas-img {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      will-change: transform;
    }
    .canvas-preview .guide {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      border: 1px dashed rgba(255, 107, 53, 0.3);
      border-radius: 16px;
    }
    .preview-scrubber-wrap {
      width: 100%;
      max-width: 340px;
      margin-top: 14px;
    }
    .preview-scrubber-wrap label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }
    .preview-scrubber-wrap label span {
      float: right;
      color: var(--accent);
      font-weight: 700;
    }
    .preview-scrubber-wrap input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .preview-status {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .preview-status.error { color: var(--danger); }
    .preview-status.success { color: var(--success); }

    /* ── Right: Settings ── */
    .settings {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .settings-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .settings h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 12px;
      margin-top: 20px;
    }
    .settings h3:first-child { margin-top: 0; }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 6px;
    }
    .field input[type="color"] {
      padding: 2px;
      height: 34px;
      cursor: pointer;
    }
    .field input[type="range"] {
      padding: 0;
      width: 100%;
      accent-color: var(--accent);
    }
    .field label .val {
      float: right;
      color: var(--accent);
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .field textarea { resize: vertical; min-height: 60px; }
    .color-row {
      display: flex;
      gap: 8px;
    }
    .color-row > div { flex: 1; }
    .template-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .template-card {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .template-card:hover { border-color: var(--accent-2); }
    .template-card.active {
      border-color: var(--accent);
      background: var(--surface-2);
    }
    .template-card .name {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 3px;
    }
    .template-card .desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .render-bar {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
    }
    .btn {
      width: 100%;
      padding: 14px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all .15s;
    }
    .btn:hover:not(:disabled) {
      background: var(--accent-2);
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--border);
    }
    .btn-tiktok {
      background: linear-gradient(135deg, #000 0%, #25F4EE 50%, #FE2C55 100%);
      color: white;
      margin-top: 8px;
      border: none;
    }
    .btn-tiktok:hover:not(:disabled) {
      background: linear-gradient(135deg, #111 0%, #25F4EE 50%, #FE2C55 100%);
      transform: translateY(-1px);
    }
    .audio-upload {
      position: relative;
    }
    .audio-upload input[type="file"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .audio-upload label {
      display: block;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }
    .audio-upload label:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .audio-current {
      margin-top: 8px;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .audio-current .clear {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 12px;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* History list */
    .history {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      min-height: 100px;
    }
    .history-item {
      flex-shrink: 0;
      width: 60px;
      height: 100px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }
    .history-item video { width: 100%; height: 100%; object-fit: cover; }
    .history-item:hover { border-color: var(--accent); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-2); }
  </style>
</head>
<body>
  <header>
    <h1><span class="brand">Reel</span> Studio</h1>
    <a href="/hub" class="back" id="back-link">← Tool Hub</a>
  </header>

  <div class="layout">
    <!-- ── LEFT: Asset Browser ── -->
    <aside class="browser">
      <div class="tabs">
        <button class="tab active" data-tab="apparel">Apparel</button>
        <button class="tab" data-tab="custom-art">Art</button>
        <button class="tab" data-tab="footage">Footage</button>
      </div>
      <div class="browser-filters">
        <input type="text" id="search-input" placeholder="Search...">
        <select id="category-filter">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="asset-grid" id="asset-grid">
        <div class="asset-empty">Loading...</div>
      </div>
    </aside>

    <!-- ── CENTER: Workspace + Preview ── -->
    <main class="workspace">
      <div class="workspace-header">
        <h2>Items <span class="count" id="selected-count">0</span> <span id="editing-label" style="font-size: 11px; color: var(--accent); margin-left: 10px;"></span></h2>
        <button class="tab" id="clear-btn" style="font-size: 12px; padding: 6px 12px;">Clear All</button>
      </div>
      <div class="selected-strip" id="selected-strip">
        <div class="selected-empty">Click items on the left to add them to your reel →</div>
      </div>
      <div class="preview-area">
        <div class="preview-tabs">
          <button class="preview-tab active" data-preview-mode="live">Live Preview</button>
          <button class="preview-tab" data-preview-mode="rendered" id="rendered-tab" disabled>Rendered</button>
        </div>
        <div id="preview-container">
          <div class="preview-placeholder">
            <div class="icon">▶</div>
            <div>Select an item to see a live preview</div>
            <div style="margin-top:6px; font-size: 11px;">Adjust sliders to see pan/zoom in real-time</div>
          </div>
        </div>
        <div class="preview-scrubber-wrap" id="scrubber-wrap" style="display:none;">
          <label>
            Pan Position <span id="scrubber-value">0%</span>
            <button id="play-btn" style="float: right; background: var(--accent); color: white; border: none; padding: 2px 10px; border-radius: 4px; font-size: 10px; cursor: pointer; font-family: inherit; font-weight: 700;">▶ Play</button>
          </label>
          <input type="range" id="scrubber" min="0" max="100" step="0.5" value="0">
        </div>
        <div class="preview-status" id="preview-status"></div>
      </div>
      <div class="history" id="history" style="display:none;"></div>
    </main>

    <!-- ── RIGHT: Settings ── -->
    <aside class="settings">
      <div class="settings-scroll">
        <h3>Template</h3>
        <div class="template-cards" id="template-cards"></div>

        <h3>Text / Copy</h3>
        <button class="btn btn-secondary" id="generate-copy-btn" style="margin: 0 0 12px; padding: 10px;">
          ✨ Auto-write copy with Ollama
        </button>
        <div id="copy-status" style="display:none; margin-bottom: 10px; padding: 8px; border-radius: 6px; font-size: 11px;"></div>
        <div class="field">
          <label>Hook / Title</label>
          <input type="text" id="field-hookText" value="Check out our latest drops">
        </div>
        <div class="field">
          <label>Subtitle / Tagline</label>
          <input type="text" id="field-subtitle" value="Made in Asheville, NC">
        </div>
        <div class="field" id="why-metal-wrap" style="display:none;">
          <label>Why Metal (one line)</label>
          <textarea id="field-whyMetal" rows="2">Museum-grade metal catches light and color that paper cannot.</textarea>
        </div>
        <div class="field" id="art-explainer-wrap" style="display:none;">
          <label>Art Explainer (2 lines)</label>
          <textarea id="field-artExplainer" rows="2">Every detail pressed into metal.
Made to live in the light.</textarea>
        </div>
        <div class="field">
          <label>Hashtags (5 max — TikTok rule) <span class="val" id="hashtag-count">0/5</span></label>
          <textarea id="field-hashtags" rows="2" placeholder="#BlueRidgeCustomCo #AshevilleNC ..."></textarea>
        </div>

        <h3>Colors</h3>
        <div class="color-row">
          <div class="field">
            <label>Background</label>
            <input type="color" id="field-bgColor" value="#111111">
          </div>
          <div class="field">
            <label>Accent</label>
            <input type="color" id="field-accent" value="#ff6b35">
          </div>
        </div>

        <h3>Animation</h3>
        <div class="field">
          <label>Transition</label>
          <select id="field-transition">
            <option value="zoom">Zoom (fade in)</option>
            <option value="slide">Slide in from right</option>
            <option value="fade">Fade</option>
          </select>
        </div>
        <div class="field">
          <label>Image Fit / Pan</label>
          <select id="field-panMode">
            <option value="ken-burns">Ken Burns (zoom + slight pan)</option>
            <option value="fit">Fit whole image (letterbox)</option>
            <option value="cover-static">Crop to fill (no movement)</option>
            <option value="pan-left-right">Pan left → right</option>
            <option value="pan-right-left">Pan right → left</option>

          <label>Pan Distance <span class="val" id="val-pan">30%</span></label>
          <input type="range" id="field-panDistance" min="0" max="100" step="5" value="30">
        </div>
        <div class="field">
          <label>Horizontal Offset <span class="val" id="val-offx">0%</span></label>
          <input type="range" id="field-offsetX" min="-50" max="50" step="2" value="0">

        <div class="field">
          <label>Vertical Offset <span class="val" id="val-offy">0%</span></label>
          <input type="range" id="field-offsetY" min="-50" max="50" step="2" value="0">

        <div class="field">
          <label>Slide Duration <span class="val" id="val-dur">2.5s</span></label>
          <input type="range" id="field-slideSeconds" min="0.5" max="10" step="0.1" value="2.5">
        </div>
        <div class="field">
          <label>Pan Speed <span class="val" id="val-speed">1.00x</span></label>
          <input type="range" id="field-panSpeed" min="0.25" max="4" step="0.05" value="1">
        </div>

        <h3>Voiceover / Music</h3>

        <h3>Shopify Landing Page</h3>
        <div class="field">

            <input type="checkbox" id="field-tiktokShop" style="accent-color: var(--accent); width: auto;">
            <span>Add products to TikTok Shop</span>

        </div>
        <button class="btn btn-secondary" id="publish-btn" style="margin-top: 0;">🛍 Publish Selected to Shopify</button>
        <div id="publish-status" style="display:none; margin-top: 8px; padding: 10px; border-radius: 6px; font-size: 11px;"></div>
        <div class="field" style="margin-top: 12px;">
          <label>CTA URL (shown in video)</label>

        <div class="field">
          <label>CTA Label</label>
          <input type="text" id="field-ctaLabel" value="Shop Now:">

      </div>
      <div class="field" style="border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px;">
        <label>Attach to Pipeline Campaign <span style="color: var(--text-muted); font-weight: normal;">(optional)</span></label>
        <select id="field-campaignRun">
          <option value="">— standalone reel —</option>
        </select>
        <div id="campaign-info" style="display:none; font-size: 11px; color: var(--text-muted); margin-top: 6px; padding: 8px; background: var(--bg-raised, #1a1a1a); border-radius: 4px;"></div>
      </div>
      <div class="field">
        <label>Theme <span style="color: var(--text-muted); font-weight: normal;">(for campaigns)</span></label>
        <select id="field-campaignTheme">
          <option value="">— pick a campaign first —</option>
        </select>
      </div>
      <div class="field">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="field-isTikTokShopReel">
          <span>First reel for this theme → TikTok Shop</span>
        </label>
      </div>
      <div class="render-bar">
        <button class="btn" id="render-btn">Render Reel</button>
        <button class="btn btn-secondary" id="finalize-campaign-btn" style="display:none; margin-top: 8px;">Finalize Campaign (Step 7b/7c)</button>
        <button class="btn btn-tiktok" id="tiktok-btn" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle; margin-right:6px;"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43V8.5a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.84-.05z"/></svg>
          Post to TikTok
        </button>
        <button class="btn btn-secondary" id="download-btn" style="display:none;">Download</button>
        <div id="tiktok-status" style="display:none; margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 11px; text-align: center;"></div>
      </div>
    </aside>
  </div>

<script>
  const apiKey = new URLSearchParams(window.location.search).get('key') || localStorage.getItem('apiKey') || '';
  if (apiKey) localStorage.setItem('apiKey', apiKey);
  document.getElementById('back-link').href = '/hub' + (apiKey ? '?key=' + encodeURIComponent(apiKey) : '');

  // Default effect values for new items
  const DEFAULT_EFFECTS = {
    panMode: 'ken-burns',
    imageScale: 1,
    imageOffsetX: 0,
    imageOffsetY: 0,
    panDistance: 30,
    panSpeed: 1,
    slideSeconds: 2.5,
  };

  const state = {
    currentTab: 'apparel',
    // selected[i] = { asset, effects: {...} }
    selected: [],
    // index of the currently edited item (null if none)
    activeIndex: null,
    assets: { apparel: [], 'custom-art': [], footage: [] },
    categories: { apparel: [], 'custom-art': [], footage: [] },
    template: 'MockupReel',
    templates: [],
    audioUrl: '',
    lastVideoUrl: '',
    // Campaign attachment — when set, rendered reels are tied to a
    // pipeline_runs row so finalize-campaign can run step 7b/7c.
    pendingCampaigns: [],
    activeCampaignId: '',
    activeCampaignTheme: '',
  };

  const assetHeaders = { 'x-api-key': apiKey };

  // ── Fetch helpers ──
  async function api(path, opts = {}) {
    const res = await fetch(path, { headers: { 'x-api-key': apiKey, ...(opts.headers || {}) }, ...opts });
    if (!res.ok) throw new Error(`${path} → ${res.status}`);
    return res.json();
  }

  function assetUrl(p) {
    if (!p) return '';
    if (p.startsWith('http')) return p;
    if (p.startsWith('/')) return p;
    return '/' + p;
  }

  // ── Load assets ──
  async function loadApparel() {
    const data = await api('/api/batch-mockups');
    state.assets.apparel = (data.mockups || []).map(m => ({
      id: 'apparel:' + m.filename,
      url: m.url,
      thumbnail: m.url,
      label: m.filename.replace(/^mockup_/, '').replace(/\.[^.]+$/, '').slice(0, 40),
      type: 'image',
      source: 'apparel',
      category: m.filename.match(/mockup_([^-]+)/)?.[1] || 'all',
    }));
  }

  async function loadCustomArt() {
    const data = await api('/api/custom-art/mockups?activeOnly=false');
    const mockups = Array.isArray(data) ? data : (data.mockups || []);
    state.assets['custom-art'] = mockups.map(m => ({
      id: 'custom-art:' + m.id,
      url: m.url || (m.filePath ? '/' + m.filePath : ''),
      thumbnail: m.url || (m.filePath ? '/' + m.filePath : ''),
      label: m.title || m.artwork?.title || `Mockup ${m.id}`,
      type: 'image',
      source: 'custom-art',
      category: m.mockupType || 'all',
    })).filter(a => a.url);
  }

  async function loadFootage() {
    const data = await api('/api/footage/clips?limit=100');
    const items = data.items || [];
    state.assets.footage = items.map(c => ({
      id: 'footage:' + c.id,
      url: `/api/footage/file/${c.filename}?key=${apiKey}`,
      thumbnail: c.thumbnail_path ? `/api/footage/thumb/${c.thumbnail_path.split('/').pop()}` : '',
      label: c.category || c.original_name?.slice(0, 30) || 'Clip',
      type: 'video',
      source: 'footage',
      category: c.category || 'all',
      duration: c.duration_seconds,
    }));
    state.categories.footage = [...new Set(items.map(c => c.category).filter(Boolean))];
  }

  // ── Render asset grid ──
  function renderAssets() {
    const grid = document.getElementById('asset-grid');
    const search = document.getElementById('search-input').value.toLowerCase();
    const categoryFilter = document.getElementById('category-filter').value;

    let assets = state.assets[state.currentTab] || [];
    if (search) assets = assets.filter(a => a.label.toLowerCase().includes(search));
    if (categoryFilter) assets = assets.filter(a => a.category === categoryFilter);

    if (assets.length === 0) {
      grid.innerHTML = '<div class="asset-empty">No items found</div>';
      return;
    }

    grid.innerHTML = '';
    assets.slice(0, 100).forEach(asset => {
      const card = document.createElement('div');
      card.className = 'asset-card';
      const selectedIdx = state.selected.findIndex(s => s.asset.id === asset.id);
      if (selectedIdx >= 0) card.classList.add('selected');

      const media = asset.type === 'video' && asset.thumbnail
        ? `<img src="${asset.thumbnail}" alt="">`
        : asset.type === 'video'
          ? `<video src="${asset.url}" muted preload="metadata"></video>`
          : `<img src="${asset.thumbnail}" alt="" loading="lazy">`;

      card.innerHTML = `
        ${media}
        <div class="label">${asset.label}</div>
        ${selectedIdx >= 0 ? `<div class="badge">${selectedIdx + 1}</div>` : ''}
      `;
      card.addEventListener('click', () => toggleAsset(asset));
      grid.appendChild(card);
    });
  }

  // ── Selection management ──
  function toggleAsset(asset) {
    const idx = state.selected.findIndex(s => s.asset.id === asset.id);
    if (idx >= 0) {
      state.selected.splice(idx, 1);
      if (state.activeIndex === idx) {
        state.activeIndex = state.selected.length > 0 ? 0 : null;
      } else if (state.activeIndex !== null && state.activeIndex > idx) {
        state.activeIndex--;
      }
    } else {
      // New item inherits current slider values as its effects
      state.selected.push({
        asset,
        effects: readEffectsFromSliders(),
      });
      // Make the newly added item active
      state.activeIndex = state.selected.length - 1;
    }
    // Update editing label
    if (state.activeIndex !== null) {
      const label = state.selected[state.activeIndex].asset.label || '';
      document.getElementById('editing-label').textContent = `Editing: ${label.slice(0, 40)}`;
    } else {
      document.getElementById('editing-label').textContent = '';
    }
    renderSelected();
    renderAssets();
    updateLivePreview();
  }

  function readEffectsFromSliders() {
    return {
      panMode: document.getElementById('field-panMode').value,
      imageScale: Number(document.getElementById('field-imageScale').value),
      imageOffsetX: Number(document.getElementById('field-offsetX').value),
      imageOffsetY: Number(document.getElementById('field-offsetY').value),
      panDistance: Number(document.getElementById('field-panDistance').value),
      panSpeed: Number(document.getElementById('field-panSpeed').value),
      slideSeconds: Number(document.getElementById('field-slideSeconds').value),
    };
  }

  function writeEffectsToSliders(eff) {
    document.getElementById('field-panMode').value = eff.panMode;
    document.getElementById('field-imageScale').value = eff.imageScale;
    document.getElementById('field-offsetX').value = eff.imageOffsetX;
    document.getElementById('field-offsetY').value = eff.imageOffsetY;
    document.getElementById('field-panDistance').value = eff.panDistance;
    document.getElementById('field-panSpeed').value = eff.panSpeed;
    document.getElementById('field-slideSeconds').value = eff.slideSeconds;
    // Refresh value displays
    document.getElementById('val-scale').textContent = Number(eff.imageScale).toFixed(2) + 'x';
    document.getElementById('val-pan').textContent = eff.panDistance + '%';
    document.getElementById('val-offx').textContent = eff.imageOffsetX + '%';
    document.getElementById('val-offy').textContent = eff.imageOffsetY + '%';
    document.getElementById('val-speed').textContent = Number(eff.panSpeed).toFixed(2) + 'x';
    document.getElementById('val-dur').textContent = Number(eff.slideSeconds).toFixed(1) + 's';
  }

  const PAN_MODE_ICONS = {
    'fit': '⊞',
    'cover-static': '▣',
    'ken-burns': '⊚',
    'pan-left-right': '→',
    'pan-right-left': '←',
    'pan-top-bottom': '↓',
    'pan-bottom-top': '↑',
  };

  function renderSelected() {
    const strip = document.getElementById('selected-strip');
    const count = document.getElementById('selected-count');
    count.textContent = state.selected.length;

    if (state.selected.length === 0) {
      strip.innerHTML = '<div class="selected-empty">Click items on the left to add them to your reel →</div>';
      return;
    }

    strip.innerHTML = '';
    state.selected.forEach((item, i) => {
      const asset = item.asset;
      const el = document.createElement('div');
      el.className = 'selected-item' + (i === state.activeIndex ? ' active' : '');
      el.draggable = true;
      el.dataset.index = i;
      const media = asset.type === 'video'
        ? (asset.thumbnail ? `<img src="${asset.thumbnail}">` : `<video src="${asset.url}" muted></video>`)
        : `<img src="${asset.thumbnail}">`;
      const panIcon = PAN_MODE_ICONS[item.effects.panMode] || '';
      const captionPreview = item.caption ? `<div class="caption-preview">${item.caption.slice(0, 18)}</div>` : '';
      el.innerHTML = `
        ${media}
        <div class="order">${i + 1}</div>
        <button class="remove" data-index="${i}">✕</button>
        ${captionPreview}
        <div class="effect-badge">${panIcon} ${item.effects.slideSeconds}s</div>
      `;
      el.addEventListener('click', (e) => {
        if (e.target.closest('.remove')) return;
        setActiveItem(i);
      });
      el.querySelector('.remove').addEventListener('click', (e) => {
        e.stopPropagation();
        state.selected.splice(i, 1);
        if (state.activeIndex === i) state.activeIndex = state.selected.length > 0 ? 0 : null;
        else if (state.activeIndex !== null && state.activeIndex > i) state.activeIndex--;
        renderSelected();
        renderAssets();
        updateLivePreview();
      });

      // Drag and drop reorder
      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', String(i));
      });
      el.addEventListener('dragover', (e) => e.preventDefault());
      el.addEventListener('drop', (e) => {
        e.preventDefault();
        const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
        const to = parseInt(el.dataset.index, 10);
        if (from === to) return;
        const [moved] = state.selected.splice(from, 1);
        state.selected.splice(to, 0, moved);
        state.activeIndex = to;
        renderSelected();
        renderAssets();
        updateLivePreview();
      });

      strip.appendChild(el);
    });
  }

  function setActiveItem(idx) {
    if (idx < 0 || idx >= state.selected.length) return;
    state.activeIndex = idx;
    // Load that item's effects into the sliders
    writeEffectsToSliders(state.selected[idx].effects);
    // Refresh strip to show new active highlight
    renderSelected();
    // Update "editing" label
    const label = state.selected[idx].asset.label || `Item ${idx + 1}`;
    document.getElementById('editing-label').textContent = `Editing: ${label.slice(0, 40)}`;
    // Reset playback + update preview
    stopPlayback();
    state.scrubberValue = 0;
    document.getElementById('scrubber').value = 0;
    document.getElementById('scrubber-value').textContent = '0%';
    updateLivePreview();
  }

  // Show/hide template-specific fields
  function updateTemplateFields() {
    const isMetal = state.template === 'MetalPrintStory';
    const whyMetalWrap = document.getElementById('why-metal-wrap');
    const artExplainerWrap = document.getElementById('art-explainer-wrap');
    if (whyMetalWrap) whyMetalWrap.style.display = isMetal ? 'block' : 'none';
    if (artExplainerWrap) artExplainerWrap.style.display = isMetal ? 'block' : 'none';

    // Metal template uses darker default colors
    if (isMetal) {
      const bg = document.getElementById('field-bgColor');
      const accent = document.getElementById('field-accent');
      if (bg.value === '#111111') bg.value = '#0a0a0a';
      if (accent.value === '#ff6b35') accent.value = '#c9a048';
    }
  }

  // ── Templates ──
  async function loadTemplates() {
    const data = await api('/api/reel-studio/templates');
    state.templates = data.templates || [];
    const container = document.getElementById('template-cards');
    container.innerHTML = '';
    state.templates.forEach(tpl => {
      const card = document.createElement('div');
      card.className = 'template-card' + (tpl.id === state.template ? ' active' : '');
      card.innerHTML = `
        <div class="name">${tpl.name}</div>
        <div class="desc">${tpl.description}</div>
      `;
      card.addEventListener('click', () => {
        state.template = tpl.id;
        document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        updateTemplateFields();
      });
      container.appendChild(card);
    });
  }

  // ── Tabs ──
  document.querySelectorAll('.tab[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab[data-tab]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.currentTab = btn.dataset.tab;
      updateCategoryFilter();
      renderAssets();
    });
  });

  function updateCategoryFilter() {
    const select = document.getElementById('category-filter');
    const cats = [...new Set((state.assets[state.currentTab] || []).map(a => a.category).filter(Boolean))];
    select.innerHTML = '<option value="">All</option>' +
      cats.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  document.getElementById('search-input').addEventListener('input', renderAssets);
  document.getElementById('category-filter').addEventListener('change', renderAssets);

  // Live slider value displays
  function bindSliderDisplay(inputId, valueId, fmt) {
    const input = document.getElementById(inputId);
    const val = document.getElementById(valueId);
    const update = () => { val.textContent = fmt(input.value); };
    input.addEventListener('input', update);
    update();
  }
  bindSliderDisplay('field-imageScale', 'val-scale', (v) => Number(v).toFixed(2) + 'x');
  bindSliderDisplay('field-panDistance', 'val-pan', (v) => v + '%');
  bindSliderDisplay('field-offsetX', 'val-offx', (v) => v + '%');
  bindSliderDisplay('field-offsetY', 'val-offy', (v) => v + '%');
  bindSliderDisplay('field-slideSeconds', 'val-dur', (v) => Number(v).toFixed(1) + 's');
  bindSliderDisplay('field-panSpeed', 'val-speed', (v) => Number(v).toFixed(2) + 'x');

  // Live hashtag counter
  function parseHashtags(text) {
    return (text || '')
      .split(/\s+/)
      .map(t => t.trim())
      .filter(t => t.startsWith('#') && t.length > 1)
      .slice(0, 20);
  }
  function updateHashtagCount() {
    const input = document.getElementById('field-hashtags');
    const counter = document.getElementById('hashtag-count');
    if (!input || !counter) return;
    const tags = parseHashtags(input.value);
    counter.textContent = `${tags.length}/5`;
    counter.style.color = tags.length === 5 ? '#6ee7b7' : tags.length > 5 ? '#fca5a5' : 'var(--accent)';
  }
  document.getElementById('field-hashtags').addEventListener('input', updateHashtagCount);
  updateHashtagCount();

  // ── Live canvas preview ──
  state.previewMode = 'live';
  state.scrubberValue = 0; // 0..100

  function updateLivePreview() {
    if (state.previewMode !== 'live') return;
    const container = document.getElementById('preview-container');
    // Use active item, fallback to first
    const idx = state.activeIndex !== null ? state.activeIndex : 0;
    const item = state.selected[idx];
    const activeAsset = item?.asset;
    if (!activeAsset || activeAsset.type !== 'image') {
      container.innerHTML = `
        <div class="preview-placeholder">
          <div class="icon">▶</div>
          <div>${activeAsset ? 'Video preview coming soon' : 'Select an image to see a live preview'}</div>
          <div style="margin-top:6px; font-size: 11px;">Click an item in the strip to edit its effects</div>
        </div>`;
      document.getElementById('scrubber-wrap').style.display = 'none';
      return;
    }

    document.getElementById('scrubber-wrap').style.display = 'block';

    // Read current settings
    const panMode = document.getElementById('field-panMode').value;
    const imageScale = Number(document.getElementById('field-imageScale').value);
    const panDistance = Number(document.getElementById('field-panDistance').value);
    const imageOffsetX = Number(document.getElementById('field-offsetX').value);
    const imageOffsetY = Number(document.getElementById('field-offsetY').value);
    const panSpeed = Number(document.getElementById('field-panSpeed').value);
    // Apply pan speed to the scrubber position (same formula as MockupSlide)
    const progress = Math.max(0, Math.min((state.scrubberValue / 100) * panSpeed, 1));

    // Build or reuse canvas DOM
    let canvas = container.querySelector('.canvas-preview');
    if (!canvas) {
      container.innerHTML = `
        <div class="canvas-preview">
          <img class="canvas-img" alt="" draggable="false">
          <div class="guide"></div>
        </div>`;
      canvas = container.querySelector('.canvas-preview');
    }
    const img = canvas.querySelector('.canvas-img');
    if (img.getAttribute('src') !== activeAsset.thumbnail) {
      img.setAttribute('src', activeAsset.thumbnail);
    }

    // Compute transform matching MockupSlide.tsx logic
    // Frame dimensions (preview canvas scale doesn't matter, we use %)
    // We use the canvas's computed dimensions
    const rect = canvas.getBoundingClientRect();
    const W = rect.width;
    const H = rect.height;

    const panPixelsX = (W * panDistance) / 100;
    const panPixelsY = (H * panDistance) / 100;
    const userOffsetX = (W * imageOffsetX) / 100;
    const userOffsetY = (H * imageOffsetY) / 100;

    let panTx = 0, panTy = 0;
    let extraScale = imageScale;

    // Reset sizing
    img.style.width = '';
    img.style.height = '';
    img.style.minWidth = '';
    img.style.minHeight = '';
    img.style.maxWidth = '';
    img.style.maxHeight = '';

    if (panMode === 'fit') {
      img.style.maxWidth = (100 * imageScale) + '%';
      img.style.maxHeight = (100 * imageScale) + '%';
      img.style.width = 'auto';
      img.style.height = 'auto';
    } else if (panMode === 'cover-static') {
      img.style.minWidth = (100 * imageScale) + '%';
      img.style.minHeight = (100 * imageScale) + '%';
      img.style.width = 'auto';
      img.style.height = 'auto';
    } else if (panMode === 'ken-burns') {
      const kbScale = (1 + progress * 0.15) * imageScale;
      extraScale = kbScale;
      panTx = -W * 0.03 * progress;
      panTy = -H * 0.02 * progress;
      img.style.minWidth = '100%';
      img.style.minHeight = '100%';
      img.style.width = 'auto';
      img.style.height = 'auto';
    } else if (panMode === 'pan-left-right') {
      const from = -panPixelsX, to = panPixelsX;
      panTx = from + (to - from) * progress;
      img.style.height = '100%';
      img.style.width = 'auto';
    } else if (panMode === 'pan-right-left') {
      const from = panPixelsX, to = -panPixelsX;
      panTx = from + (to - from) * progress;
      img.style.height = '100%';
      img.style.width = 'auto';
    } else if (panMode === 'pan-top-bottom') {
      const from = -panPixelsY, to = panPixelsY;
      panTy = from + (to - from) * progress;
      img.style.width = '100%';
      img.style.height = 'auto';
    } else if (panMode === 'pan-bottom-top') {
      const from = panPixelsY, to = -panPixelsY;
      panTy = from + (to - from) * progress;
      img.style.width = '100%';
      img.style.height = 'auto';
    }

    const totalTx = userOffsetX + panTx;
    const totalTy = userOffsetY + panTy;
    img.style.transform = `translate(calc(-50% + ${totalTx}px), calc(-50% + ${totalTy}px)) scale(${extraScale})`;
    img.style.transformOrigin = 'center';
  }

  // Bind all control inputs: save to active item's effects + refresh preview

    updateLivePreview();

  // Auto-play animation
  state.playing = false;
  state.playStart = 0;
  state.playRaf = null;

  function stopPlayback() {
    state.playing = false;
    if (state.playRaf) cancelAnimationFrame(state.playRaf);
    const btn = document.getElementById('play-btn');
    if (btn) btn.textContent = '▶ Play';
  }

  function playTick(now) {
    if (!state.playing) return;
    const slideMs = Number(document.getElementById('field-slideSeconds').value) * 1000;
    const elapsed = now - state.playStart;
    const t = (elapsed % slideMs) / slideMs;
    state.scrubberValue = t * 100;
    scrubber.value = state.scrubberValue;
    document.getElementById('scrubber-value').textContent = Math.round(state.scrubberValue) + '%';
    updateLivePreview();
    state.playRaf = requestAnimationFrame(playTick);
  }

  // ── Render ──
  function buildProps() {
    const hookText = document.getElementById('field-hookText').value;
    const subtitle = document.getElementById('field-subtitle').value;
    const bgColor = document.getElementById('field-bgColor').value;
    const accent = document.getElementById('field-accent').value;

    const panMode = document.getElementById('field-panMode').value;
    const imageScale = Number(document.getElementById('field-imageScale').value);
    const panDistance = Number(document.getElementById('field-panDistance').value);
    const imageOffsetX = Number(document.getElementById('field-offsetX').value);
    const imageOffsetY = Number(document.getElementById('field-offsetY').value);
    const slideSeconds = Number(document.getElementById('field-slideSeconds').value);
    const panSpeed = Number(document.getElementById('field-panSpeed').value);
    const ctaUrl = document.getElementById('field-ctaUrl').value.trim();
    const ctaLabel = document.getElementById('field-ctaLabel').value.trim() || 'Shop Now:';

    // Prefix URLs with current origin so render context can resolve them
    const origin = window.location.protocol + '//' + window.location.host;
    const absoluteUrl = (u) => u.startsWith('http') ? u : origin + u;

    if (state.template === 'MockupReel') {
      return {
        source: 'all',
        limit: state.selected.length || 1,
        hookText,
        brandName: 'BlueRidge Custom Co.',
        location: subtitle,
        bgColor,
        accent,
        transition,
        // Global fallback values (used if an item's effects don't override)
        panMode,
        imageScale,
        imageOffsetX,
        imageOffsetY,
        panDistance,
        slideSeconds,
        panSpeed,
        audioUrl: state.audioUrl ? absoluteUrl(state.audioUrl) : '',
        audioVolume: 1,
        ctaUrl,
        ctaLabel,
        mockupImages: state.selected.map(s => absoluteUrl(s.asset.url)),
        labels: state.selected.map(s => s.asset.label),
        captions: state.selected.map(s => s.caption || ''),
        subtitles: state.selected.map(s => s.subtitle || ''),
        // Per-item effect overrides
        itemEffects: state.selected.map(s => s.effects),
      };
    }

    if (state.template === 'MetalPrintStory') {
      // Split selected items: videos = process clips, images = mockups
      const processClips = state.selected
        .filter(s => s.asset.type === 'video')
        .map(s => ({
          url: absoluteUrl(s.asset.url),
          durationInFrames: 90,
        }));
      const mockupImgs = state.selected
        .filter(s => s.asset.type === 'image')
        .map(s => absoluteUrl(s.asset.url));
      // First image is hero
      const heroImage = mockupImgs[0] || '';
      const remainingMockups = mockupImgs.slice(1);

      return {
        hook,
        processIntro: 'Watch it come to life',
        artExplainer: document.getElementById('field-artExplainer')?.value || 'Every detail pressed into metal.\nMade to live in the light.',
        whyMetal: document.getElementById('field-whyMetal')?.value || 'Museum-grade metal catches light and color that paper cannot.',
        ctaText: 'Shop Now',
        outro: subtitle,
        brandName: 'BlueRidge Custom Co.',
        processClips,
        mockupImages: remainingMockups,
        heroImage,
        bgColor,
        accent,
        audioUrl: state.audioUrl ? absoluteUrl(state.audioUrl) : '',
        audioVolume: 1,
        ctaUrl,
      };
    }

    if (state.template === 'FootageReel') {
      return {
        category: '',
        limit: state.selected.length || 1,
        maxFramesPerClip: 120,
        hookText,
        tagline: subtitle,
        brandName: 'BlueRidge Custom Co.',
        bgColor,
        accent,
        showLabels: true,
        muteVideo: !!state.audioUrl,
        audioUrl: state.audioUrl ? absoluteUrl(state.audioUrl) : '',
        audioVolume: 1,
        clips: state.selected.map(s => ({
          url: absoluteUrl(s.asset.url),
          type: 'video',
          label: s.asset.label,
          durationInFrames: Math.min(Math.max(Math.floor((s.asset.duration || 3) * 30), 60), 120),
        })),
      };
    }

    if (state.template === 'CatalogShowcase') {
      return {
        category: '',
        limit: state.selected.length || 1,
        title: hookText,
        subtitle,
        bgStart: bgColor,
        bgEnd: accent,
        accent,
        showCta: true,
        ctaText: 'Shop Now →',
        showCategoryBadge: false,
        images: state.selected.map(s => absoluteUrl(s.asset.url)),
        names: state.selected.map(s => s.asset.label),
        categoryBadge: '',
      };
    }
    return {};
  }

  document.getElementById('render-btn').addEventListener('click', async () => {

        template: state.template,

      // Attach to pipeline campaign if selected
      if (state.activeCampaignId && state.activeCampaignTheme) {

  // ── AI copy generation (Ollama) ──
  async function fetchArtworkMeta(asset) {
    // For apparel mockups, derive title from label; for custom-art, fetch from DB
    if (asset.source === 'apparel') {
      return {
        title: asset.label || 'apparel design',
        theme: '',
        mood: '',
        keywords: [],
      };
    }
    if (asset.source === 'custom-art') {
      // Try to resolve artwork id from asset id
      const artId = (asset.id || '').split(':')[1];
      try {
        const res = await fetch(`/api/custom-art/artwork/${artId}`, {
          headers: { 'x-api-key': apiKey },
        });
        const data = await res.json();
        const a = data.artwork || data;
        return {
          title: a.title || asset.label,
          theme: a.theme || a.category || '',
          mood: a.mood || '',
          keywords: a.keywords || [],
          description: a.description || '',
        };
      } catch (e) {
        return { title: asset.label, theme: '', mood: '', keywords: [] };
      }
    }
    return { title: asset.label, theme: '', mood: '', keywords: [] };
  }

  document.getElementById('generate-copy-btn').addEventListener('click', async () => {
    if (state.selected.length === 0) {
      alert('Select items first');
      return;

    const tpl = state.templates.find(t => t.id === state.template);
    if (!tpl?.supportsCopy) {

    const btn = document.getElementById('generate-copy-btn');
    const status = document.getElementById('copy-status');

    status.textContent = 'Collecting design metadata...';

    try {
      // Gather metadata for each selected item
      const items = await Promise.all(
        state.selected.map(s => fetchArtworkMeta(s.asset))
      );

      status.textContent = 'Ollama is writing copy (this can take 30-90s)...';
      const res = await fetch('/api/reel-studio/generate-copy', {
        method: 'POST',
        headers: { 'x-api-key': apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          template: tpl.copyTemplate,
          items,
          vibe: document.getElementById('field-subtitle').value,
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Generation failed');

      const copy = data.copy;
      // Write the generated copy into the form fields
      if (tpl.copyTemplate === 'metal-print') {
        document.getElementById('field-hookText').value = copy.hook || '';
        document.getElementById('field-subtitle').value = copy.outro || '';
        if (document.getElementById('field-whyMetal')) {
          document.getElementById('field-whyMetal').value = copy.whyMetal || '';
        }
        if (document.getElementById('field-artExplainer')) {
          document.getElementById('field-artExplainer').value = copy.artExplainer || '';
        }
        state.copyData = copy;
      } else {
        // apparel: hook + outro + per-item captions
        document.getElementById('field-hookText').value = copy.hook || '';
        document.getElementById('field-subtitle').value = copy.outro || '';

        (copy.items || []).forEach((item, i) => {
          if (state.selected[i]) {
            state.selected[i].caption = item.caption || '';
            state.selected[i].subtitle = item.subtitle || '';

      const resolveRes = await fetch('/api/reel-studio/resolve-designs', {
        method: 'POST',
        headers: { 'x-api-key': apiKey, 'Content-Type': 'application/json' },

      });
      const resolveData = await resolveRes.json();
      const designIds = (resolveData.resolved || [])
        .filter(r => r.designId)
        .map(r => r.designId);

        throw new Error('Could not match any mockups to catalog designs');

      status.textContent = `Publishing ${designIds.length} design(s)${unmatched ? ` (${unmatched} skipped)` : ''}...`;

        method: 'POST',

    } finally {
      btn.disabled = false;
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle; margin-right:6px;"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43V8.5a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.84-.05z"/></svg>Post to TikTok';
    }
  });

  // ── History ──
  async function loadHistory() {
    try {
      const data = await api('/api/reel-studio/history');
      const history = data.history || [];
      const container = document.getElementById('history');
      if (history.length === 0) {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'flex';
      const keyedUrl = (u) => u + (u.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(apiKey);
      container.innerHTML = history.slice(0, 10).map(h => `
        <div class="history-item" data-url="${keyedUrl(h.videoUrl)}">
          <video src="${keyedUrl(h.videoUrl)}" muted preload="metadata"></video>
        </div>
      `).join('');
      container.querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', () => {
          document.getElementById('preview-container').innerHTML = `
            <video class="preview-video" src="${el.dataset.url}" controls autoplay muted loop playsinline></video>
          `;
          state.lastVideoUrl = el.dataset.url;
          document.getElementById('download-btn').style.display = 'block';
        });
      });
    } catch (e) { console.error(e); }
  }

  // ── Pipeline campaign attachment ──
  async function loadPendingCampaigns() {
    try {
      const res = await fetch('/api/reel-studio/pending-campaigns', { headers: { 'x-api-key': apiKey } });
      const data = await res.json();
      state.pendingCampaigns = data.campaigns || [];
      const sel = document.getElementById('field-campaignRun');
      // Preserve placeholder
      sel.innerHTML = '<option value="">— standalone reel —</option>';
      for (const c of state.pendingCampaigns) {
        const opt = document.createElement('option');
        opt.value = c.id;
        const themeCount = Object.keys(c.themes || {}).length;
        opt.textContent = `${c.collection || c.campaignSlug || c.id} — ${themeCount} theme(s), ${c.existingReelCount} reel(s) made`;
        sel.appendChild(opt);
      }
    } catch (e) {
      console.error('[reel-studio] loadPendingCampaigns:', e);
    }
  }

  function onCampaignChange() {
    const runId = document.getElementById('field-campaignRun').value;
    state.activeCampaignId = runId;
    const info = document.getElementById('campaign-info');
    const themeSel = document.getElementById('field-campaignTheme');
    const finalizeBtn = document.getElementById('finalize-campaign-btn');
    themeSel.innerHTML = '';

    if (!runId) {
      info.style.display = 'none';
      themeSel.innerHTML = '<option value="">— pick a campaign first —</option>';
      state.activeCampaignTheme = '';
      finalizeBtn.style.display = 'none';
      return;
    }

    const camp = state.pendingCampaigns.find(c => c.id === runId);
    if (!camp) return;

    const themeNames = Object.keys(camp.themes || {});
    themeSel.innerHTML = '<option value="">— select theme —</option>' +
      themeNames.map(t => {
        const count = (camp.themes[t] || []).length;
        const withShopify = (camp.themes[t] || []).filter(i => i.shopifyProductId).length;
        return `<option value="${t}">${t} (${count} designs, ${withShopify} on Shopify)</option>`;
      }).join('');

    const existingByTheme = {};
    for (const r of (camp.existingReels || [])) {
      existingByTheme[r.theme] = (existingByTheme[r.theme] || 0) + 1;
    }
    info.innerHTML = `
      <strong>${camp.collection || camp.campaignSlug}</strong><br>
      Status: ${camp.status} · ${camp.existingReelCount} reel(s) already made<br>
      ${Object.entries(existingByTheme).map(([t, n]) => `· ${t}: ${n} reel(s)`).join('<br>') || '<em>no reels yet</em>'}
    `;
    info.style.display = 'block';
    finalizeBtn.style.display = camp.existingReelCount > 0 ? 'inline-block' : 'none';
  }

  function onCampaignThemeChange() {
    state.activeCampaignTheme = document.getElementById('field-campaignTheme').value;
    // Auto-set isTikTokShopReel for the first reel of a theme
    const camp = state.pendingCampaigns.find(c => c.id === state.activeCampaignId);
    if (camp && state.activeCampaignTheme) {
      const alreadyHasTheme = (camp.existingReels || []).some(r => r.theme === state.activeCampaignTheme);
      document.getElementById('field-isTikTokShopReel').checked = !alreadyHasTheme;
    }
  }

  document.getElementById('field-campaignRun').addEventListener('change', onCampaignChange);
  document.getElementById('field-campaignTheme').addEventListener('change', onCampaignThemeChange);

  document.getElementById('finalize-campaign-btn').addEventListener('click', async () => {
    const runId = state.activeCampaignId;
    if (!runId) return;
    if (!confirm('Finalize this campaign? This runs TikTok Shop publishing + Shopify landing pages for all reels made so far.')) return;
    const btn = document.getElementById('finalize-campaign-btn');
    btn.disabled = true;
    btn.textContent = 'Finalizing...';
    try {
      const res = await fetch('/api/reel-studio/finalize-campaign/' + encodeURIComponent(runId), {
        method: 'POST',
        headers: { 'x-api-key': apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ notify: true })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Finalize failed');
      alert(`Finalized!\nLanding pages: ${data.landingPages?.created || 0}\nTikTok Shop added: ${data.tiktokShop?.added || 0}`);
      await loadPendingCampaigns();
      document.getElementById('field-campaignRun').value = '';
      onCampaignChange();
    } catch (e) {
      alert('Finalize failed: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Finalize Campaign (Step 7b/7c)';
    }
  });

  // ── Init ──
  async function init() {
    try {
      await Promise.all([
        loadTemplates(),
        loadApparel().catch(e => console.error('apparel:', e)),
        loadCustomArt().catch(e => console.error('custom-art:', e)),
        loadFootage().catch(e => console.error('footage:', e)),
        loadPendingCampaigns().catch(e => console.error('campaigns:', e)),
      ]);
      updateCategoryFilter();
      renderAssets();
      loadHistory();
      updateTemplateFields();
    } catch (e) {
      document.getElementById('asset-grid').innerHTML = `<div class="asset-empty">Error loading: ${e.message}</div>`;
    }
  }

  init();
</script>
</body>
</html>

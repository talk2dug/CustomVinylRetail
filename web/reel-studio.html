<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel Studio — Blue Ridge Custom Co</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Montserrat:wght@400;600;700;900&display=swap">
  <style>
    :root {
      --bg: #0b1020;
      --surface: #151b33;
      --surface-2: #1d2443;
      --border: #2a3256;
      --text: #e7ebf5;
      --muted: #8a93ab;
      --accent: #ff6b35;
      --accent-2: #ffa95c;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }
    header h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    header .brand { color: var(--accent); }
    header .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }
    header .back:hover { color: var(--text); }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* ── Left: Asset Browser ── */
    .browser {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 14px 10px;
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .browser-filters {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .browser-filters input, .browser-filters select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 6px;
      min-width: 0;
    }
    .browser-filters input:focus, .browser-filters select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .asset-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      align-content: start;
    }
    .asset-card {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 1;
      position: relative;
      transition: all .15s;
    }
    .asset-card:hover {
      border-color: var(--accent-2);
      transform: translateY(-1px);
    }
    .asset-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent);
    }
    .asset-card img, .asset-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .asset-card .label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      color: white;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .asset-card .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--accent);
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .asset-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .load-more {
      grid-column: 1 / -1;
      padding: 12px;
      background: var(--surface-2);
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }
    .load-more:hover { color: var(--text); border-color: var(--accent); }

    /* ── Center: Workspace ── */
    .workspace {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .workspace-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .workspace-header h2 {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .workspace-header .count {
      font-size: 13px;
      color: var(--accent);
      font-weight: 700;
    }
    .selected-strip {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      overflow-x: auto;
      min-height: 120px;
      align-items: center;
    }
    .selected-strip::-webkit-scrollbar { height: 6px; }
    .selected-strip::-webkit-scrollbar-track { background: var(--surface); }
    .selected-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .selected-item {
      position: relative;
      width: 90px;
      height: 90px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: var(--surface);
      cursor: grab;
    }
    .selected-item img, .selected-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .selected-item .order {
      position: absolute;
      top: 4px;
      left: 4px;
      background: var(--accent);
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .selected-item .remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.7);
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .selected-item .remove:hover { background: var(--danger); }
    .selected-empty {
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
    }

    .preview-area {
      flex: 1;
      min-height: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #preview-container {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-placeholder {
      width: 240px;
      aspect-ratio: 9/16;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }
    .preview-placeholder .icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .preview-video {
      max-height: 100%;
      max-width: 100%;
      height: auto;
      width: auto;
      aspect-ratio: 9/16;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      display: block;
    }
    .preview-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .preview-tab {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .preview-tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .preview-tab:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .canvas-preview {
      position: relative;
      max-height: 100%;
      height: min(100%, 600px);
      aspect-ratio: 9/16;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
      display: block;
    }
    .canvas-preview .canvas-img {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      will-change: transform;
    }
    .canvas-preview .guide {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      border: 1px dashed rgba(255, 107, 53, 0.3);
      border-radius: 16px;
    }
    .preview-scrubber-wrap {
      width: 100%;
      max-width: 340px;
      margin-top: 14px;
    }
    .preview-scrubber-wrap label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }
    .preview-scrubber-wrap label span {
      float: right;
      color: var(--accent);
      font-weight: 700;
    }
    .preview-scrubber-wrap input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .preview-status {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .preview-status.error { color: var(--danger); }
    .preview-status.success { color: var(--success); }

    /* ── Right: Settings ── */
    .settings {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .settings-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .settings h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 12px;
      margin-top: 20px;
    }
    .settings h3:first-child { margin-top: 0; }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 6px;
    }
    .field input[type="color"] {
      padding: 2px;
      height: 34px;
      cursor: pointer;
    }
    .field input[type="range"] {
      padding: 0;
      width: 100%;
      accent-color: var(--accent);
    }
    .field label .val {
      float: right;
      color: var(--accent);
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .field textarea { resize: vertical; min-height: 60px; }
    .color-row {
      display: flex;
      gap: 8px;
    }
    .color-row > div { flex: 1; }
    .template-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .template-card {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .template-card:hover { border-color: var(--accent-2); }
    .template-card.active {
      border-color: var(--accent);
      background: var(--surface-2);
    }
    .template-card .name {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 3px;
    }
    .template-card .desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .render-bar {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
    }
    .btn {
      width: 100%;
      padding: 14px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all .15s;
    }
    .btn:hover:not(:disabled) {
      background: var(--accent-2);
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--border);
    }
    .audio-upload {
      position: relative;
    }
    .audio-upload input[type="file"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .audio-upload label {
      display: block;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }
    .audio-upload label:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .audio-current {
      margin-top: 8px;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .audio-current .clear {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 12px;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* History list */
    .history {
      position: fixed;
      bottom: 20px;
      left: 340px;
      right: 360px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: calc(100vw - 700px);
      background: rgba(21, 27, 51, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      z-index: 10;
    }
    .history-item {
      flex-shrink: 0;
      width: 60px;
      height: 100px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }
    .history-item video { width: 100%; height: 100%; object-fit: cover; }
    .history-item:hover { border-color: var(--accent); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-2); }
  </style>
</head>
<body>
  <header>
    <h1><span class="brand">Reel</span> Studio</h1>
    <a href="/hub" class="back" id="back-link">← Tool Hub</a>
  </header>

  <div class="layout">
    <!-- ── LEFT: Asset Browser ── -->
    <aside class="browser">
      <div class="tabs">
        <button class="tab active" data-tab="apparel">Apparel</button>
        <button class="tab" data-tab="custom-art">Art</button>
        <button class="tab" data-tab="footage">Footage</button>
      </div>
      <div class="browser-filters">
        <input type="text" id="search-input" placeholder="Search...">
        <select id="category-filter">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="asset-grid" id="asset-grid">
        <div class="asset-empty">Loading...</div>
      </div>
    </aside>

    <!-- ── CENTER: Workspace + Preview ── -->
    <main class="workspace">
      <div class="workspace-header">
        <h2>Selected Items <span class="count" id="selected-count">0</span></h2>
        <button class="tab" id="clear-btn" style="font-size: 12px; padding: 6px 12px;">Clear All</button>
      </div>
      <div class="selected-strip" id="selected-strip">
        <div class="selected-empty">Click items on the left to add them to your reel →</div>
      </div>
      <div class="preview-area">
        <div class="preview-tabs">
          <button class="preview-tab active" data-preview-mode="live">Live Preview</button>
          <button class="preview-tab" data-preview-mode="rendered" id="rendered-tab" disabled>Rendered</button>
        </div>
        <div id="preview-container">
          <div class="preview-placeholder">
            <div class="icon">▶</div>
            <div>Select an item to see a live preview</div>
            <div style="margin-top:6px; font-size: 11px;">Adjust sliders to see pan/zoom in real-time</div>
          </div>
        </div>
        <div class="preview-scrubber-wrap" id="scrubber-wrap" style="display:none;">
          <label>Pan Position <span id="scrubber-value">0%</span></label>
          <input type="range" id="scrubber" min="0" max="100" step="1" value="0">
        </div>
        <div class="preview-status" id="preview-status"></div>
      </div>
    </main>

    <!-- ── RIGHT: Settings ── -->
    <aside class="settings">
      <div class="settings-scroll">
        <h3>Template</h3>
        <div class="template-cards" id="template-cards"></div>

        <h3>Text</h3>
        <div class="field">
          <label>Hook / Title</label>
          <input type="text" id="field-hookText" value="Check out our latest drops">
        </div>
        <div class="field">
          <label>Subtitle / Tagline</label>
          <input type="text" id="field-subtitle" value="Made in Asheville, NC">
        </div>

        <h3>Colors</h3>
        <div class="color-row">
          <div class="field">
            <label>Background</label>
            <input type="color" id="field-bgColor" value="#111111">
          </div>
          <div class="field">
            <label>Accent</label>
            <input type="color" id="field-accent" value="#ff6b35">
          </div>
        </div>

        <h3>Animation</h3>
        <div class="field">
          <label>Transition</label>
          <select id="field-transition">
            <option value="zoom">Zoom (fade in)</option>
            <option value="slide">Slide in from right</option>
            <option value="fade">Fade</option>
          </select>
        </div>
        <div class="field">
          <label>Image Fit / Pan</label>
          <select id="field-panMode">
            <option value="ken-burns">Ken Burns (zoom + slight pan)</option>
            <option value="fit">Fit whole image (letterbox)</option>
            <option value="cover-static">Crop to fill (no movement)</option>
            <option value="pan-left-right">Pan left → right</option>
            <option value="pan-right-left">Pan right → left</option>
            <option value="pan-top-bottom">Pan top → bottom</option>
            <option value="pan-bottom-top">Pan bottom → top</option>
          </select>
        </div>
        <div class="field">
          <label>Image Scale <span class="val" id="val-scale">1.00x</span></label>
          <input type="range" id="field-imageScale" min="0.5" max="3" step="0.05" value="1">
        </div>
        <div class="field">
          <label>Pan Distance <span class="val" id="val-pan">30%</span></label>
          <input type="range" id="field-panDistance" min="0" max="100" step="5" value="30">
        </div>
        <div class="field">
          <label>Horizontal Offset <span class="val" id="val-offx">0%</span></label>
          <input type="range" id="field-offsetX" min="-50" max="50" step="2" value="0">
        </div>
        <div class="field">
          <label>Vertical Offset <span class="val" id="val-offy">0%</span></label>
          <input type="range" id="field-offsetY" min="-50" max="50" step="2" value="0">
        </div>

        <h3>Voiceover / Music</h3>
        <div class="audio-upload">
          <label for="audio-input" id="audio-label">+ Upload audio (mp3, wav)</label>
          <input type="file" id="audio-input" accept="audio/*">
        </div>
        <div id="audio-current" style="display:none;" class="audio-current">
          <span id="audio-name"></span>
          <button class="clear" id="audio-clear">✕</button>
        </div>
      </div>
      <div class="render-bar">
        <button class="btn" id="render-btn">Render Reel</button>
        <button class="btn btn-secondary" id="download-btn" style="display:none;">Download</button>
      </div>
    </aside>
  </div>

  <div class="history" id="history" style="display:none;"></div>

<script>
  const apiKey = new URLSearchParams(window.location.search).get('key') || localStorage.getItem('apiKey') || '';
  if (apiKey) localStorage.setItem('apiKey', apiKey);
  document.getElementById('back-link').href = '/hub' + (apiKey ? '?key=' + encodeURIComponent(apiKey) : '');

  const state = {
    currentTab: 'apparel',
    selected: [],
    assets: { apparel: [], 'custom-art': [], footage: [] },
    categories: { apparel: [], 'custom-art': [], footage: [] },
    template: 'MockupReel',
    templates: [],
    audioUrl: '',
    lastVideoUrl: '',
  };

  const assetHeaders = { 'x-api-key': apiKey };

  // ── Fetch helpers ──
  async function api(path, opts = {}) {
    const res = await fetch(path, { headers: { 'x-api-key': apiKey, ...(opts.headers || {}) }, ...opts });
    if (!res.ok) throw new Error(`${path} → ${res.status}`);
    return res.json();
  }

  function assetUrl(p) {
    if (!p) return '';
    if (p.startsWith('http')) return p;
    if (p.startsWith('/')) return p;
    return '/' + p;
  }

  // ── Load assets ──
  async function loadApparel() {
    const data = await api('/api/batch-mockups');
    state.assets.apparel = (data.mockups || []).map(m => ({
      id: 'apparel:' + m.filename,
      url: m.url,
      thumbnail: m.url,
      label: m.filename.replace(/^mockup_/, '').replace(/\.[^.]+$/, '').slice(0, 40),
      type: 'image',
      source: 'apparel',
      category: m.filename.match(/mockup_([^-]+)/)?.[1] || 'all',
    }));
  }

  async function loadCustomArt() {
    const data = await api('/api/custom-art/mockups?activeOnly=false');
    const mockups = Array.isArray(data) ? data : (data.mockups || []);
    state.assets['custom-art'] = mockups.map(m => ({
      id: 'custom-art:' + m.id,
      url: m.url || (m.filePath ? '/' + m.filePath : ''),
      thumbnail: m.url || (m.filePath ? '/' + m.filePath : ''),
      label: m.title || m.artwork?.title || `Mockup ${m.id}`,
      type: 'image',
      source: 'custom-art',
      category: m.mockupType || 'all',
    })).filter(a => a.url);
  }

  async function loadFootage() {
    const data = await api('/api/footage/clips?limit=100');
    const items = data.items || [];
    state.assets.footage = items.map(c => ({
      id: 'footage:' + c.id,
      url: `/api/footage/file/${c.filename}?key=${apiKey}`,
      thumbnail: c.thumbnail_path ? `/api/footage/thumb/${c.thumbnail_path.split('/').pop()}` : '',
      label: c.category || c.original_name?.slice(0, 30) || 'Clip',
      type: 'video',
      source: 'footage',
      category: c.category || 'all',
      duration: c.duration_seconds,
    }));
    state.categories.footage = [...new Set(items.map(c => c.category).filter(Boolean))];
  }

  // ── Render asset grid ──
  function renderAssets() {
    const grid = document.getElementById('asset-grid');
    const search = document.getElementById('search-input').value.toLowerCase();
    const categoryFilter = document.getElementById('category-filter').value;

    let assets = state.assets[state.currentTab] || [];
    if (search) assets = assets.filter(a => a.label.toLowerCase().includes(search));
    if (categoryFilter) assets = assets.filter(a => a.category === categoryFilter);

    if (assets.length === 0) {
      grid.innerHTML = '<div class="asset-empty">No items found</div>';
      return;
    }

    grid.innerHTML = '';
    assets.slice(0, 100).forEach(asset => {
      const card = document.createElement('div');
      card.className = 'asset-card';
      const selectedIdx = state.selected.findIndex(s => s.id === asset.id);
      if (selectedIdx >= 0) card.classList.add('selected');

      const media = asset.type === 'video' && asset.thumbnail
        ? `<img src="${asset.thumbnail}" alt="">`
        : asset.type === 'video'
          ? `<video src="${asset.url}" muted preload="metadata"></video>`
          : `<img src="${asset.thumbnail}" alt="" loading="lazy">`;

      card.innerHTML = `
        ${media}
        <div class="label">${asset.label}</div>
        ${selectedIdx >= 0 ? `<div class="badge">${selectedIdx + 1}</div>` : ''}
      `;
      card.addEventListener('click', () => toggleAsset(asset));
      grid.appendChild(card);
    });
  }

  // ── Selection management ──
  function toggleAsset(asset) {
    const idx = state.selected.findIndex(s => s.id === asset.id);
    if (idx >= 0) {
      state.selected.splice(idx, 1);
    } else {
      state.selected.push(asset);
    }
    renderSelected();
    renderAssets();
  }

  function renderSelected() {
    const strip = document.getElementById('selected-strip');
    const count = document.getElementById('selected-count');
    count.textContent = state.selected.length;

    if (state.selected.length === 0) {
      strip.innerHTML = '<div class="selected-empty">Click items on the left to add them to your reel →</div>';
      return;
    }

    strip.innerHTML = '';
    state.selected.forEach((asset, i) => {
      const el = document.createElement('div');
      el.className = 'selected-item';
      el.draggable = true;
      el.dataset.index = i;
      const media = asset.type === 'video'
        ? (asset.thumbnail ? `<img src="${asset.thumbnail}">` : `<video src="${asset.url}" muted></video>`)
        : `<img src="${asset.thumbnail}">`;
      el.innerHTML = `
        ${media}
        <div class="order">${i + 1}</div>
        <button class="remove" data-index="${i}">✕</button>
      `;
      el.querySelector('.remove').addEventListener('click', (e) => {
        e.stopPropagation();
        state.selected.splice(i, 1);
        renderSelected();
        renderAssets();
      });

      // Drag and drop reorder
      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', String(i));
      });
      el.addEventListener('dragover', (e) => e.preventDefault());
      el.addEventListener('drop', (e) => {
        e.preventDefault();
        const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
        const to = parseInt(el.dataset.index, 10);
        if (from === to) return;
        const [moved] = state.selected.splice(from, 1);
        state.selected.splice(to, 0, moved);
        renderSelected();
        renderAssets();
      });

      strip.appendChild(el);
    });
  }

  // ── Templates ──
  async function loadTemplates() {
    const data = await api('/api/reel-studio/templates');
    state.templates = data.templates || [];
    const container = document.getElementById('template-cards');
    container.innerHTML = '';
    state.templates.forEach(tpl => {
      const card = document.createElement('div');
      card.className = 'template-card' + (tpl.id === state.template ? ' active' : '');
      card.innerHTML = `
        <div class="name">${tpl.name}</div>
        <div class="desc">${tpl.description}</div>
      `;
      card.addEventListener('click', () => {
        state.template = tpl.id;
        document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      });
      container.appendChild(card);
    });
  }

  // ── Tabs ──
  document.querySelectorAll('.tab[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab[data-tab]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.currentTab = btn.dataset.tab;
      updateCategoryFilter();
      renderAssets();
    });
  });

  function updateCategoryFilter() {
    const select = document.getElementById('category-filter');
    const cats = [...new Set((state.assets[state.currentTab] || []).map(a => a.category).filter(Boolean))];
    select.innerHTML = '<option value="">All</option>' +
      cats.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  document.getElementById('search-input').addEventListener('input', renderAssets);
  document.getElementById('category-filter').addEventListener('change', renderAssets);

  // Live slider value displays
  function bindSliderDisplay(inputId, valueId, fmt) {
    const input = document.getElementById(inputId);
    const val = document.getElementById(valueId);
    const update = () => { val.textContent = fmt(input.value); };
    input.addEventListener('input', update);
    update();
  }
  bindSliderDisplay('field-imageScale', 'val-scale', (v) => Number(v).toFixed(2) + 'x');
  bindSliderDisplay('field-panDistance', 'val-pan', (v) => v + '%');
  bindSliderDisplay('field-offsetX', 'val-offx', (v) => v + '%');
  bindSliderDisplay('field-offsetY', 'val-offy', (v) => v + '%');

  // ── Live canvas preview ──
  state.previewMode = 'live';
  state.scrubberValue = 0; // 0..100

  function updateLivePreview() {
    if (state.previewMode !== 'live') return;
    const container = document.getElementById('preview-container');
    const first = state.selected[0];
    if (!first || first.type !== 'image') {
      container.innerHTML = `
        <div class="preview-placeholder">
          <div class="icon">▶</div>
          <div>${first ? 'Video preview coming soon' : 'Select an image to see a live preview'}</div>
          <div style="margin-top:6px; font-size: 11px;">Adjust sliders to see pan/zoom in real-time</div>
        </div>`;
      document.getElementById('scrubber-wrap').style.display = 'none';
      return;
    }

    document.getElementById('scrubber-wrap').style.display = 'block';

    // Read current settings
    const panMode = document.getElementById('field-panMode').value;
    const imageScale = Number(document.getElementById('field-imageScale').value);
    const panDistance = Number(document.getElementById('field-panDistance').value);
    const imageOffsetX = Number(document.getElementById('field-offsetX').value);
    const imageOffsetY = Number(document.getElementById('field-offsetY').value);
    const progress = state.scrubberValue / 100;

    // Build or reuse canvas DOM
    let canvas = container.querySelector('.canvas-preview');
    if (!canvas) {
      container.innerHTML = `
        <div class="canvas-preview">
          <img class="canvas-img" alt="" draggable="false">
          <div class="guide"></div>
        </div>`;
      canvas = container.querySelector('.canvas-preview');
    }
    const img = canvas.querySelector('.canvas-img');
    if (img.getAttribute('src') !== first.thumbnail) {
      img.setAttribute('src', first.thumbnail);
    }

    // Compute transform matching MockupSlide.tsx logic
    // Frame dimensions (preview canvas scale doesn't matter, we use %)
    // We use the canvas's computed dimensions
    const rect = canvas.getBoundingClientRect();
    const W = rect.width;
    const H = rect.height;

    const panPixelsX = (W * panDistance) / 100;
    const panPixelsY = (H * panDistance) / 100;
    const userOffsetX = (W * imageOffsetX) / 100;
    const userOffsetY = (H * imageOffsetY) / 100;

    let panTx = 0, panTy = 0;
    let extraScale = imageScale;

    // Reset sizing
    img.style.width = '';
    img.style.height = '';
    img.style.minWidth = '';
    img.style.minHeight = '';
    img.style.maxWidth = '';
    img.style.maxHeight = '';

    if (panMode === 'fit') {
      img.style.maxWidth = (100 * imageScale) + '%';
      img.style.maxHeight = (100 * imageScale) + '%';
      img.style.width = 'auto';
      img.style.height = 'auto';
    } else if (panMode === 'cover-static') {
      img.style.minWidth = (100 * imageScale) + '%';
      img.style.minHeight = (100 * imageScale) + '%';
      img.style.width = 'auto';
      img.style.height = 'auto';
    } else if (panMode === 'ken-burns') {
      const kbScale = (1 + progress * 0.15) * imageScale;
      extraScale = kbScale;
      panTx = -W * 0.03 * progress;
      panTy = -H * 0.02 * progress;
      img.style.minWidth = '100%';
      img.style.minHeight = '100%';
      img.style.width = 'auto';
      img.style.height = 'auto';
    } else if (panMode === 'pan-left-right') {
      const from = -panPixelsX, to = panPixelsX;
      panTx = from + (to - from) * progress;
      img.style.height = '100%';
      img.style.width = 'auto';
    } else if (panMode === 'pan-right-left') {
      const from = panPixelsX, to = -panPixelsX;
      panTx = from + (to - from) * progress;
      img.style.height = '100%';
      img.style.width = 'auto';
    } else if (panMode === 'pan-top-bottom') {
      const from = -panPixelsY, to = panPixelsY;
      panTy = from + (to - from) * progress;
      img.style.width = '100%';
      img.style.height = 'auto';
    } else if (panMode === 'pan-bottom-top') {
      const from = panPixelsY, to = -panPixelsY;
      panTy = from + (to - from) * progress;
      img.style.width = '100%';
      img.style.height = 'auto';
    }

    const totalTx = userOffsetX + panTx;
    const totalTy = userOffsetY + panTy;
    img.style.transform = `translate(calc(-50% + ${totalTx}px), calc(-50% + ${totalTy}px)) scale(${extraScale})`;
    img.style.transformOrigin = 'center';
  }

  // Bind all control inputs to live preview refresh
  ['field-panMode', 'field-imageScale', 'field-panDistance', 'field-offsetX', 'field-offsetY'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateLivePreview);
  });

  // Scrubber
  const scrubber = document.getElementById('scrubber');
  scrubber.addEventListener('input', () => {
    state.scrubberValue = Number(scrubber.value);
    document.getElementById('scrubber-value').textContent = scrubber.value + '%';
    updateLivePreview();
  });

  // Preview tabs (live vs rendered)
  document.querySelectorAll('.preview-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      if (tab.disabled) return;
      document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      state.previewMode = tab.dataset.previewMode;
      if (state.previewMode === 'live') {
        updateLivePreview();
      } else if (state.previewMode === 'rendered' && state.lastVideoUrl) {
        const container = document.getElementById('preview-container');
        container.innerHTML = `
          <video class="preview-video" src="${state.lastVideoUrl}" controls autoplay muted loop playsinline></video>
        `;
      }
    });
  });

  // Re-run live preview on selection change
  const originalRenderSelected = renderSelected;
  renderSelected = function() {
    originalRenderSelected.apply(this, arguments);
    if (state.previewMode === 'live') updateLivePreview();
  };

  document.getElementById('clear-btn').addEventListener('click', () => {
    state.selected = [];
    renderSelected();
    renderAssets();
  });

  // ── Audio upload ──
  document.getElementById('audio-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('audio-label').textContent = 'Uploading...';
    try {
      const res = await fetch('/api/reel-studio/upload-audio', {
        method: 'POST',
        headers: { 'x-api-key': apiKey, 'Content-Type': file.type },
        body: file,
      });
      const data = await res.json();
      if (data.success) {
        state.audioUrl = data.url;
        document.getElementById('audio-label').textContent = '+ Change audio';
        document.getElementById('audio-current').style.display = 'flex';
        document.getElementById('audio-name').textContent = file.name;
      }
    } catch (err) {
      alert('Upload failed: ' + err.message);
      document.getElementById('audio-label').textContent = '+ Upload audio (mp3, wav)';
    }
  });

  document.getElementById('audio-clear').addEventListener('click', () => {
    state.audioUrl = '';
    document.getElementById('audio-current').style.display = 'none';
    document.getElementById('audio-input').value = '';
    document.getElementById('audio-label').textContent = '+ Upload audio (mp3, wav)';
  });

  // ── Render ──
  function buildProps() {
    const hookText = document.getElementById('field-hookText').value;
    const subtitle = document.getElementById('field-subtitle').value;
    const bgColor = document.getElementById('field-bgColor').value;
    const accent = document.getElementById('field-accent').value;
    const transition = document.getElementById('field-transition').value;
    const panMode = document.getElementById('field-panMode').value;
    const imageScale = Number(document.getElementById('field-imageScale').value);
    const panDistance = Number(document.getElementById('field-panDistance').value);
    const imageOffsetX = Number(document.getElementById('field-offsetX').value);
    const imageOffsetY = Number(document.getElementById('field-offsetY').value);

    // Prefix URLs with current origin so render context can resolve them
    const origin = window.location.protocol + '//' + window.location.host;
    const absoluteUrl = (u) => u.startsWith('http') ? u : origin + u;

    if (state.template === 'MockupReel') {
      return {
        source: 'all',
        limit: state.selected.length || 1,
        hookText,
        brandName: 'BlueRidge Custom Co.',
        location: subtitle,
        bgColor,
        accent,
        transition,
        panMode,
        imageScale,
        imageOffsetX,
        imageOffsetY,
        panDistance,
        audioUrl: state.audioUrl ? absoluteUrl(state.audioUrl) : '',
        audioVolume: 1,
        mockupImages: state.selected.map(a => absoluteUrl(a.url)),
        labels: state.selected.map(a => a.label),
      };
    }

    if (state.template === 'FootageReel') {
      return {
        category: '',
        limit: state.selected.length || 1,
        maxFramesPerClip: 120,
        hookText,
        tagline: subtitle,
        brandName: 'BlueRidge Custom Co.',
        bgColor,
        accent,
        showLabels: true,
        muteVideo: !!state.audioUrl,
        audioUrl: state.audioUrl ? absoluteUrl(state.audioUrl) : '',
        audioVolume: 1,
        clips: state.selected.map(a => ({
          url: absoluteUrl(a.url),
          type: 'video',
          label: a.label,
          durationInFrames: Math.min(Math.max(Math.floor((a.duration || 3) * 30), 60), 120),
        })),
      };
    }

    if (state.template === 'CatalogShowcase') {
      return {
        category: '',
        limit: state.selected.length || 1,
        title: hookText,
        subtitle,
        bgStart: bgColor,
        bgEnd: accent,
        accent,
        showCta: true,
        ctaText: 'Shop Now →',
        showCategoryBadge: false,
        images: state.selected.map(a => absoluteUrl(a.url)),
        names: state.selected.map(a => a.label),
        categoryBadge: '',
      };
    }
    return {};
  }

  document.getElementById('render-btn').addEventListener('click', async () => {
    if (state.selected.length === 0) {
      alert('Select at least one item first');
      return;
    }

    // Validate template supports the selected asset type
    const tpl = state.templates.find(t => t.id === state.template);
    const selectedType = state.selected[0].type;
    if (tpl && tpl.assetType !== selectedType) {
      if (!confirm(`The ${tpl.name} template is for ${tpl.assetType}s but you selected ${selectedType}s. Continue anyway?`)) return;
    }

    const btn = document.getElementById('render-btn');
    const status = document.getElementById('preview-status');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Rendering...';
    status.className = 'preview-status';
    status.textContent = 'Rendering video, this may take 30-90 seconds...';

    try {
      const props = buildProps();
      const res = await fetch('/api/reel-studio/render', {
        method: 'POST',
        headers: { 'x-api-key': apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          template: state.template,
          props,
          label: document.getElementById('field-hookText').value,
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Render failed');

      state.lastVideoUrl = data.videoUrl + '?key=' + encodeURIComponent(apiKey);
      document.getElementById('preview-container').innerHTML = `
        <video class="preview-video" src="${state.lastVideoUrl}" controls autoplay muted loop playsinline></video>
      `;
      // Switch to rendered tab
      document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active'));
      const renderedTab = document.getElementById('rendered-tab');
      renderedTab.disabled = false;
      renderedTab.classList.add('active');
      state.previewMode = 'rendered';
      document.getElementById('scrubber-wrap').style.display = 'none';

      status.className = 'preview-status success';
      status.textContent = `✓ Rendered in ${(data.durationMs / 1000).toFixed(1)}s`;
      document.getElementById('download-btn').style.display = 'block';
      loadHistory();
    } catch (e) {
      status.className = 'preview-status error';
      status.textContent = '✗ ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Render Reel';
    }
  });

  document.getElementById('download-btn').addEventListener('click', () => {
    if (state.lastVideoUrl) {
      const a = document.createElement('a');
      a.href = state.lastVideoUrl;
      a.download = 'reel-' + Date.now() + '.mp4';
      a.click();
    }
  });

  // ── History ──
  async function loadHistory() {
    try {
      const data = await api('/api/reel-studio/history');
      const history = data.history || [];
      const container = document.getElementById('history');
      if (history.length === 0) {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'flex';
      const keyedUrl = (u) => u + (u.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(apiKey);
      container.innerHTML = history.slice(0, 10).map(h => `
        <div class="history-item" data-url="${keyedUrl(h.videoUrl)}">
          <video src="${keyedUrl(h.videoUrl)}" muted preload="metadata"></video>
        </div>
      `).join('');
      container.querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', () => {
          document.getElementById('preview-container').innerHTML = `
            <video class="preview-video" src="${el.dataset.url}" controls autoplay muted loop playsinline></video>
          `;
          state.lastVideoUrl = el.dataset.url;
          document.getElementById('download-btn').style.display = 'block';
        });
      });
    } catch (e) { console.error(e); }
  }

  // ── Init ──
  async function init() {
    try {
      await Promise.all([
        loadTemplates(),
        loadApparel().catch(e => console.error('apparel:', e)),
        loadCustomArt().catch(e => console.error('custom-art:', e)),
        loadFootage().catch(e => console.error('footage:', e)),
      ]);
      updateCategoryFilter();
      renderAssets();
      loadHistory();
    } catch (e) {
      document.getElementById('asset-grid').innerHTML = `<div class="asset-empty">Error loading: ${e.message}</div>`;
    }
  }

  init();
</script>
</body>
</html>

<body>
  <div id="root"></div>

  <!-- Early ready signal before React loads -->
  <script>
    console.log('[Mockup] Early script - setting up message listener');
    window._pendingMessages = [];
    window._reactReady = false;

    // Listen for messages immediately
    window.addEventListener('message', function(event) {
      console.log('[Mockup] Early listener got message:', event.data?.type);
      if (!window._reactReady && event.data?.type) {
        console.log('[Mockup] Queuing message for React:', event.data.type);
        window._pendingMessages.push(event.data);
      }
    });

    // Send ready signal immediately
    if (window.parent !== window) {
      console.log('[Mockup] Sending early MOCKUP_READY');
      window.parent.postMessage({ type: 'MOCKUP_READY' }, '*');
    }
  </script>

  <script type="text/babel">
    console.log('[Mockup] Script starting...');
    const { useState, useRef, useCallback, useEffect } = React;

    function WallArtMockup() {
      const [roomImage, setRoomImage] = useState(null);
      const [roomSize, setRoomSize] = useState({ width: 0, height: 0 });
      const [artworks, setArtworks] = useState([]);
      const [selectedArt, setSelectedArt] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [isResizing, setIsResizing] = useState(false);
      const [isRotating, setIsRotating] = useState(false);
      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const [copiedPerspective, setCopiedPerspective] = useState(null);

      // Zoom
      const [zoom, setZoom] = useState(1);

      // Grid and snapping
      const [snapEnabled, setSnapEnabled] = useState(true);
      const [snapToArt, setSnapToArt] = useState(true);
      const [showGrid, setShowGrid] = useState(false);
      const [gridSize, setGridSize] = useState(20);
      const [gap, setGap] = useState(10);
      const [snapLines, setSnapLines] = useState({ horizontal: [], vertical: [] });

      // For external export (postMessage)
      const [exportRequested, setExportRequested] = useState(false);

      // Debug state
      const [debugMsg, setDebugMsg] = useState('Waiting for message...');

      // Artwork database modal state
      const [showArtworkModal, setShowArtworkModal] = useState(false);
      const [dbArtworks, setDbArtworks] = useState([]);
      const [loadingDbArtworks, setLoadingDbArtworks] = useState(false);
      const [selectedDbArtwork, setSelectedDbArtwork] = useState(null);

      // Tile modal state
      const [showTileModal, setShowTileModal] = useState(false);
      const [tileCols, setTileCols] = useState(2);
      const [tileRows, setTileRows] = useState(2);
      const [tileArtworkId, setTileArtworkId] = useState(null); // Store the artwork ID being tiled
      // Tile dimensions (in inches) - determines aspect ratio of each tile
      const [tileSizeWidth, setTileSizeWidth] = useState(12);
      const [tileSizeHeight, setTileSizeHeight] = useState(12);

      // Size scale - pixels per inch for converting to real dimensions
      // Default 10 means 100px = 10 inches (user can adjust)
      const [pixelsPerInch, setPixelsPerInch] = useState(10);

      // Master tile size - ensures all tiles across all artworks are uniform
      // When set, new tiles will match this size and existing tiles can be normalized
      const [masterTileSize, setMasterTileSize] = useState({ width: 100, height: 100 });

      // Multi-select for tile groups - array of selected artwork IDs
      const [selectedGroup, setSelectedGroup] = useState([]);

      const containerRef = useRef(null);
      const roomRef = useRef(null);
      const wrapperRef = useRef(null);

      const snapThreshold = 8;

      // Listen for messages from parent window (print-station)
      useEffect(() => {
        console.log('[Mockup] Setting up message listener');
        setDebugMsg('Message listener set up');
        const handleMessage = (event) => {
          setDebugMsg('Message received: ' + (event.data?.type || 'unknown'));
          console.log('[Mockup] Received message:', event.data?.type);
          const { type, roomImage: newRoomImage, artworkImage, materialFilter } = event.data || {};

          if (type === 'SET_MOCKUP') {
            // Set room image from URL
            if (newRoomImage) {
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.onload = () => {
                setRoomSize({ width: img.width, height: img.height });
                setRoomImage(newRoomImage);
                setZoom(1);
              };
              img.src = newRoomImage;
            }

            // Add artwork if provided
            if (artworkImage) {
              const artImg = new Image();
              artImg.crossOrigin = 'anonymous';
              artImg.onload = () => {
                // Calculate aspect ratio and scale to fit within max bounds while maintaining ratio
                const aspectRatio = artImg.width / artImg.height;
                const maxWidth = 400;
                const maxHeight = 300;
                let width, height;

                if (artImg.width <= maxWidth && artImg.height <= maxHeight) {
                  // Image fits within bounds, use original size
                  width = artImg.width;
                  height = artImg.height;
                } else if (aspectRatio > maxWidth / maxHeight) {
                  // Width is the limiting factor
                  width = maxWidth;
                  height = maxWidth / aspectRatio;
                } else {
                  // Height is the limiting factor
                  height = maxHeight;
                  width = maxHeight * aspectRatio;
                }

                const newArt = {
                  id: Date.now(),
                  src: artworkImage,
                  x: 100,
                  y: 100,
                  width: width,
                  height: height,
                  aspectRatio: aspectRatio,
                  rotation: 0,
                  perspective: { rotateX: 0, rotateY: 0, scale: 1 },
                  filter: materialFilter || 'none'
                };
                setArtworks([newArt]);
                setSelectedArt(newArt.id);
              };
              artImg.src = artworkImage;
            }
          }

          if (type === 'EXPORT_MOCKUP') {
            setExportRequested(true);
          }

          // Handle artwork list from database
          if (type === 'ARTWORK_LIST') {
            console.log('[Mockup] Received ARTWORK_LIST:', event.data.artworks?.length || 0, 'items');
            setDbArtworks(event.data.artworks || []);
            setLoadingDbArtworks(false);
          }

          // Handle tiled artwork result - replace current artwork with tiles
          if (type === 'TILED_ARTWORK_RESULT') {
            const { artworkId, tiles, cols, rows, tileWidth: msgTileWidth, tileHeight: msgTileHeight, tileAspectRatio } = event.data;
            console.log('[Mockup] Received TILED_ARTWORK_RESULT:', tiles?.length || 0, 'tiles, artworkId:', artworkId, 'aspectRatio:', tileAspectRatio);

            if (tiles && tiles.length > 0) {
              // First, detect gap from existing tiles (before setArtworks)
              // We need to access current artworks to detect the gap
              const currentArtworksSnapshot = artworks;
              const existingTilesSnapshot = currentArtworksSnapshot.filter(a => a.tileRow !== undefined);

              let detectedGap = gap || 10;
              if (existingTilesSnapshot.length >= 2) {
                const sortedByX = [...existingTilesSnapshot].sort((a, b) => a.x - b.x);
                for (let i = 1; i < sortedByX.length; i++) {
                  const prev = sortedByX[i - 1];
                  const curr = sortedByX[i];
                  if (Math.abs(prev.y - curr.y) < 5) {
                    const gapCalc = curr.x - (prev.x + prev.width);
                    if (gapCalc > 0 && gapCalc < 200) {
                      detectedGap = gapCalc;
                      console.log('[Mockup] Pre-detected gap from existing tiles:', detectedGap);
                      break;
                    }
                  }
                }
              }

              // Update gap state immediately so new tiles use it
              setGap(detectedGap);

              // Use functional update to get current artworks state
              setArtworks(currentArtworks => {
                console.log('[Mockup] Current artworks:', currentArtworks.map(a => ({ id: a.id, type: typeof a.id })));

                // Find the original artwork to get its position (use artworkId from message)
                const artIdToReplace = artworkId;
                console.log('[Mockup] Will replace artwork with id:', artIdToReplace, 'type:', typeof artIdToReplace);

                const originalArt = currentArtworks.find(a => a.id === artIdToReplace);
                console.log('[Mockup] Found original art:', originalArt ? 'yes' : 'no');

                if (!originalArt) {
                  // Try loose comparison in case of type mismatch
                  const looseMatch = currentArtworks.find(a => String(a.id) === String(artIdToReplace));
                  console.log('[Mockup] Loose match found:', looseMatch ? 'yes' : 'no');
                }

                const baseX = originalArt ? originalArt.x : 100;
                const baseY = originalArt ? originalArt.y : 100;

                // Check if there are existing tiles to match size with
                const existingTiles = currentArtworks.filter(a => a.tileRow !== undefined);
                let tileWidth, tileHeight;

                if (existingTiles.length > 0) {
                  // Match size of existing tiles for uniformity
                  tileWidth = existingTiles[0].width;
                  tileHeight = existingTiles[0].height;
                  console.log('[Mockup] Matching existing tile size:', tileWidth, 'x', tileHeight);
                } else {
                  // Use the aspect ratio from the message to calculate tile dimensions
                  // Base size is 100px for the larger dimension, then calculate the other
                  const basePixelSize = 100;
                  const aspectRatio = tileAspectRatio || (msgTileWidth && msgTileHeight ? msgTileWidth / msgTileHeight : 1);

                  if (aspectRatio >= 1) {
                    // Width is larger or equal - width = baseSize, height = baseSize / ratio
                    tileWidth = basePixelSize;
                    tileHeight = basePixelSize / aspectRatio;
                  } else {
                    // Height is larger - height = baseSize, width = baseSize * ratio
                    tileHeight = basePixelSize;
                    tileWidth = basePixelSize * aspectRatio;
                  }
                  console.log('[Mockup] Using aspect ratio:', aspectRatio, '-> tile size:', tileWidth, 'x', tileHeight);
                }

                // Use the detected gap
                const tileGap = detectedGap;
                console.log('[Mockup] Using tile gap:', tileGap);

                // Filter out the original and add tiles
                const filtered = currentArtworks.filter(a => a.id !== artIdToReplace);
                console.log('[Mockup] Filtered count:', filtered.length, 'from:', currentArtworks.length);

                // Generate a unique group ID for this set of tiles
                const tileGroupId = `group_${Date.now()}`;

                const newTiles = tiles.map((tile, idx) => {
                  const col = tile.col - 1;
                  const row = tile.row - 1;
                  // Round positions to integers to avoid floating-point precision issues with gaps
                  const x = Math.round(baseX + col * (tileWidth + tileGap));
                  const y = Math.round(baseY + row * (tileHeight + tileGap));
                  return {
                    id: Date.now() + idx,
                    src: tile.url,
                    name: `Tile ${tile.row}-${tile.col}`,
                    x,
                    y,
                    width: tileWidth,
                    height: tileHeight,
                    aspectRatio: tileWidth / tileHeight,
                    rotation: 0,
                    rotateX: 0,
                    rotateY: 0,
                    skewX: 0,
                    skewY: 0,
                    filter: 'none',
                    tileRow: tile.row,
                    tileCol: tile.col,
                    tileGroupId  // Track which tiles belong together
                  };
                });

                // Update master tile size to match what we used
                setMasterTileSize({ width: tileWidth, height: tileHeight });

                return [...filtered, ...newTiles];
              });

              setSelectedArt(null);
              setTileArtworkId(null);
            }
          }

          // Handle tiled mockup (split panel artwork)
          if (type === 'SET_TILED_MOCKUP') {
            const { roomImage: tiledRoomImage, cols, rows, tileWidth, tileHeight, gap: tileGap, tiles } = event.data;
            console.log('[Mockup] SET_TILED_MOCKUP received:', { tiledRoomImage, cols, rows, tileWidth, tileHeight, tileGap, tilesCount: tiles?.length });
            console.log('[Mockup] Tiles:', tiles);

            // Load the room image first
            if (tiledRoomImage) {
              console.log('[Mockup] Loading room image, length:', tiledRoomImage.length, 'starts with:', tiledRoomImage.substring(0, 50));
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.onerror = (e) => {
                console.error('[Mockup] FAILED to load room image:', e);
              };
              img.onload = () => {
                console.log('[Mockup] Room image loaded:', img.width, 'x', img.height);
                setRoomSize({ width: img.width, height: img.height });
                setRoomImage(tiledRoomImage);
                setZoom(1);

                // Once room is loaded, add the tiles as artwork pieces
                // We'll position them in a grid layout
                const baseSize = 100; // Base pixel size for tiles in mockup
                const scaleFactor = baseSize / Math.max(tileWidth, tileHeight);
                const pixelWidth = tileWidth * scaleFactor;
                const pixelHeight = tileHeight * scaleFactor;
                const pixelGap = (tileGap || 1) * scaleFactor;

                // Starting position (center of room roughly)
                const startX = (img.width / 2) - ((cols * pixelWidth + (cols - 1) * pixelGap) / 2);
                const startY = (img.height / 2) - ((rows * pixelHeight + (rows - 1) * pixelGap) / 2);

                const newArtworks = [];
                let loadedCount = 0;
                const totalTiles = tiles.length;
                // Generate a unique group ID for this set of tiles
                const tileGroupId = `group_${Date.now()}`;

                tiles.forEach((tile, index) => {
                  const tileImg = new Image();
                  tileImg.crossOrigin = 'anonymous';
                  tileImg.onload = () => {
                    const col = tile.col - 1; // 1-indexed from server
                    const row = tile.row - 1;
                    // Round positions to integers to avoid floating-point precision issues
                    const x = Math.round(startX + (col * (pixelWidth + pixelGap)));
                    const y = Math.round(startY + (row * (pixelHeight + pixelGap)));

                    newArtworks.push({
                      id: Date.now() + index,
                      src: tile.url,
                      x,
                      y,
                      width: pixelWidth,
                      height: pixelHeight,
                      aspectRatio: pixelWidth / pixelHeight,
                      rotation: 0,
                      rotateX: 0,
                      rotateY: 0,
                      skewX: 0,
                      skewY: 0,
                      filter: 'none',
                      tileRow: tile.row,
                      tileCol: tile.col,
                      tileGroupId  // Track which tiles belong together
                    });

                    loadedCount++;
                    if (loadedCount === totalTiles) {
                      // All tiles loaded, sort by row then col and set
                      newArtworks.sort((a, b) => {
                        if (a.tileRow !== b.tileRow) return a.tileRow - b.tileRow;
                        return a.tileCol - b.tileCol;
                      });
                      setArtworks(newArtworks);
                      setGap(pixelGap);
                      // Set the master tile size so subsequent tiles match
                      setMasterTileSize({ width: pixelWidth, height: pixelHeight });
                    }
                  };
                  tileImg.onerror = () => {
                    console.error('[Mockup] Failed to load tile:', tile.url);
                    loadedCount++;
                  };
                  tileImg.src = tile.url;
                });
              };
              img.onerror = () => console.error('[Mockup] Failed to load room image:', tiledRoomImage);
              img.src = tiledRoomImage;
            }
          }
        };

        window.addEventListener('message', handleMessage);

        // Mark React as ready and process any queued messages
        window._reactReady = true;
        console.log('[Mockup] React mounted, processing', window._pendingMessages?.length || 0, 'queued messages');
        if (window._pendingMessages && window._pendingMessages.length > 0) {
          window._pendingMessages.forEach(data => {
            console.log('[Mockup] Processing queued message:', data.type);
            handleMessage({ data });
          });
          window._pendingMessages = [];
        }

        // Signal to parent that we're ready to receive messages
        console.log('[Mockup] React mounted, sending MOCKUP_READY signal');
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'MOCKUP_READY' }, '*');
        }

        return () => window.removeEventListener('message', handleMessage);
      }, []);

      // Handle export request
      useEffect(() => {
        if (exportRequested && roomImage) {
          exportImage(true); // true = send via postMessage
          setExportRequested(false);
        }
      }, [exportRequested, roomImage]);

      const filters = [
        { id: 'none', name: 'None', icon: '🖼️' },
        { id: 'metal', name: 'Metal Print', icon: '✨' },
        { id: 'canvas', name: 'Canvas', icon: '🎨' },
      ];

      const handleRoomUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              setRoomSize({ width: img.width, height: img.height });
              setRoomImage(e.target.result);
              setZoom(1);
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      };

      const handleArtUpload = (e) => {
        const files = Array.from(e.target.files);
        files.forEach((file) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const aspectRatio = img.width / img.height;
              const defaultHeight = 160;
              setArtworks((prev) => [
                ...prev,
                {
                  id: Date.now() + Math.random(),
                  src: event.target.result,
                  name: file.name,
                  x: 80 + (prev.length % 4) * 50,
                  y: 80 + Math.floor(prev.length / 4) * 50,
                  width: defaultHeight * aspectRatio,
                  height: defaultHeight,
                  aspectRatio,
                  rotation: 0,
                  rotateX: 0,
                  rotateY: 0,
                  skewX: 0,
                  skewY: 0,
                  filter: 'none',
                },
              ]);
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });
        e.target.value = '';
      };

      // Open artwork modal and request artwork list from parent
      const openArtworkModal = () => {
        console.log('[Mockup] openArtworkModal CALLED');
        setShowArtworkModal(true);
        setLoadingDbArtworks(true);
        setSelectedDbArtwork(null);
        // Request artwork list from parent window
        if (window.parent !== window) {
          console.log('[Mockup] Requesting artwork list from parent');
          window.parent.postMessage({ type: 'GET_ARTWORK_LIST' }, '*');
        } else {
          console.log('[Mockup] WARNING: window.parent === window, cannot send message');
        }
      };

      // Add selected database artwork to canvas
      const addDbArtworkToCanvas = () => {
        if (!selectedDbArtwork) return;

        const artImg = new Image();
        artImg.onload = () => {
          const aspectRatio = artImg.width / artImg.height;
          const defaultHeight = 160;
          setArtworks((prev) => [
            ...prev,
            {
              id: Date.now() + Math.random(),
              src: selectedDbArtwork.url,
              name: selectedDbArtwork.name || 'Artwork',
              x: 80 + (prev.length % 4) * 50,
              y: 80 + Math.floor(prev.length / 4) * 50,
              width: defaultHeight * aspectRatio,
              height: defaultHeight,

              rotateX: 0,
              rotateY: 0,
              skewX: 0,

          ]);
          setShowArtworkModal(false);

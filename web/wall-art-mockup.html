        };
        artImg.onerror = () => {
          console.error('[Mockup] Failed to load artwork:', selectedDbArtwork.url);
        };
        artImg.src = selectedDbArtwork.url;
      };

      // Open tile modal for selected artwork
      const openTileModal = (e) => {
        console.log('[Mockup] openTileModal called, selectedArt:', selectedArt);
        // Stop all event propagation immediately
        if (e) {
          e.stopPropagation();
          e.preventDefault();
        }
        if (!selectedArt) {
          console.log('[Mockup] openTileModal: no selectedArt, returning');
          return;
        }
        const artId = selectedArt; // Capture the value
        setTileArtworkId(artId); // Store the artwork ID
        console.log('[Mockup] openTileModal: setting showTileModal to true, artId:', artId);
        // Use setTimeout to ensure the state update happens after event processing
        setTimeout(() => {
          setShowTileModal(true);
          console.log('[Mockup] openTileModal: showTileModal should now be true');
        }, 0);
      };

      // Request tiling of selected artwork
      const tileSelectedArtwork = () => {
        const artId = tileArtworkId || selectedArt;
        const artwork = artworks.find(a => a.id === artId);
        if (!artwork || !window.parent) return;

        // Calculate aspect ratio from tile dimensions
        const tileAspectRatio = tileSizeWidth / tileSizeHeight;

        console.log('[Mockup] Requesting tile split:', { artId, cols: tileCols, rows: tileRows, tileWidth: tileSizeWidth, tileHeight: tileSizeHeight, aspectRatio: tileAspectRatio });
        window.parent.postMessage({
          type: 'TILE_ARTWORK',
          artworkId: artId,  // Pass the ID so we can remove the original when tiles come back
          artworkSrc: artwork.src,
          artworkName: artwork.name || 'Artwork',
          cols: tileCols,
          rows: tileRows,
          tileWidth: tileSizeWidth,
          tileHeight: tileSizeHeight,
          tileAspectRatio
        }, '*');
        setShowTileModal(false);
        // Don't clear tileArtworkId here - we need it when result comes back
        // Actually we pass it in the message now, so it's ok to clear
        setTileArtworkId(null);
      };

      const handleZoom = (delta) => {
        setZoom((prev) => Math.min(4, Math.max(0.25, prev + delta)));
      };

      const snapToGridFn = (value) => {
        if (!snapEnabled) return value;
        return Math.round(value / gridSize) * gridSize;
      };

      const findSnapPoints = (currentArt, newX, newY, newWidth, newHeight) => {
        if (!snapToArt) return { x: newX, y: newY, lines: { horizontal: [], vertical: [] } };
        
        const lines = { horizontal: [], vertical: [] };
        let snappedX = newX;
        let snappedY = newY;
        
        const currentRight = newX + newWidth;
        const currentBottom = newY + newHeight;
        const currentCenterX = newX + newWidth / 2;
        const currentCenterY = newY + newHeight / 2;

        artworks.forEach((art) => {
          if (art.id === currentArt.id) return;
          
          const artRight = art.x + art.width;
          const artBottom = art.y + art.height;
          const artCenterX = art.x + art.width / 2;
          const artCenterY = art.y + art.height / 2;

          if (Math.abs(newX - art.x) < snapThreshold) { snappedX = art.x; lines.vertical.push(art.x); }
          if (Math.abs(newX - artRight - gap) < snapThreshold) { snappedX = artRight + gap; lines.vertical.push(artRight + gap / 2); }
          if (Math.abs(currentRight - artRight) < snapThreshold) { snappedX = artRight - newWidth; lines.vertical.push(artRight); }
          if (Math.abs(currentRight - art.x + gap) < snapThreshold) { snappedX = art.x - gap - newWidth; lines.vertical.push(art.x - gap / 2); }
          if (Math.abs(currentCenterX - artCenterX) < snapThreshold) { snappedX = artCenterX - newWidth / 2; lines.vertical.push(artCenterX); }
          if (Math.abs(newY - art.y) < snapThreshold) { snappedY = art.y; lines.horizontal.push(art.y); }
          if (Math.abs(newY - artBottom - gap) < snapThreshold) { snappedY = artBottom + gap; lines.horizontal.push(artBottom + gap / 2); }
          if (Math.abs(currentBottom - artBottom) < snapThreshold) { snappedY = artBottom - newHeight; lines.horizontal.push(artBottom); }
          if (Math.abs(currentBottom - art.y + gap) < snapThreshold) { snappedY = art.y - gap - newHeight; lines.horizontal.push(art.y - gap / 2); }
          if (Math.abs(currentCenterY - artCenterY) < snapThreshold) { snappedY = artCenterY - newHeight / 2; lines.horizontal.push(artCenterY); }
        });

        return { x: snappedX, y: snappedY, lines };
      };

      const handleMouseDown = (e, art, action = 'drag') => {
        e.stopPropagation();
        e.preventDefault();
        setSelectedArt(art.id);
        
        if (action === 'resize') {
          setIsResizing(true);
        } else if (action === 'rotate') {
          setIsRotating(true);
        } else {
          setIsDragging(true);
          const rect = containerRef.current.getBoundingClientRect();
          const mouseX = (e.clientX - rect.left) / zoom;
          const mouseY = (e.clientY - rect.top) / zoom;
          setDragOffset({ x: mouseX - art.x, y: mouseY - art.y });
        }
      };

      const handleMouseMove = (e) => {
        if (!selectedArt || !containerRef.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        const currentArt = artworks.find(a => a.id === selectedArt);
        if (!currentArt) return;
        
        // Adjust mouse position for zoom
        const mouseX = (e.clientX - rect.left) / zoom;
        const mouseY = (e.clientY - rect.top) / zoom;
        
        if (isDragging) {
          let newX = mouseX - dragOffset.x;
          let newY = mouseY - dragOffset.y;
          
          if (snapEnabled && !snapToArt) {
            newX = snapToGridFn(newX);
            newY = snapToGridFn(newY);
          }
          
          const snapResult = findSnapPoints(currentArt, newX, newY, currentArt.width, currentArt.height);
          newX = snapResult.x;
          newY = snapResult.y;
          setSnapLines(snapResult.lines);
          
          setArtworks((prev) =>
            prev.map((art) =>
              art.id === selectedArt
                ? { ...art, x: Math.max(0, newX), y: Math.max(0, newY) }
                : art
            )
          );
        } else if (isResizing) {
          let newWidth = Math.max(60, mouseX - currentArt.x);
          if (snapEnabled) newWidth = snapToGridFn(newWidth);
          const newHeight = newWidth / currentArt.aspectRatio;
          
          setArtworks((prev) =>
            prev.map((art) =>
              art.id === selectedArt ? { ...art, width: newWidth, height: newHeight } : art
            )
          );
        } else if (isRotating) {
          const artCenterX = currentArt.x + currentArt.width / 2;
          const artCenterY = currentArt.y + currentArt.height / 2;
          const angle = Math.atan2(mouseX - artCenterX, -(mouseY - artCenterY)) * (180 / Math.PI);
          
          setArtworks((prev) =>
            prev.map((art) =>
              art.id === selectedArt ? { ...art, rotation: Math.round(angle) } : art
            )
          );
        }
      };

      const handleMouseUp = () => {
        setIsDragging(false);
        setIsResizing(false);
        setIsRotating(false);
        setSnapLines({ horizontal: [], vertical: [] });
      };

      const handleCanvasClick = (e) => {
        if (e.target === containerRef.current || e.target.classList.contains('room-image')) {
          setSelectedArt(null);
        }
      };

      const handleWheel = (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          const delta = e.deltaY > 0 ? -0.1 : 0.1;
          handleZoom(delta);
        }
      };

      const updateArtwork = (property, value) => {
        setArtworks((prev) =>
          prev.map((art) =>
            art.id === selectedArt ? { ...art, [property]: value } : art
          )
        );
      };

      const setFilter = (filterId) => updateArtwork('filter', filterId);

      const applyFilterToAll = (filterId) => {
        setArtworks((prev) => prev.map((art) => ({ ...art, filter: filterId })));
      };

      const deleteSelected = () => {
        if (selectedGroup.length > 0) {
          // Delete all tiles in the selected group
          setArtworks((prev) => prev.filter((a) => !selectedGroup.includes(a.id)));
          setSelectedGroup([]);
          setSelectedArt(null);
        } else {
          setArtworks((prev) => prev.filter((a) => a.id !== selectedArt));
          setSelectedArt(null);
        }
      };

      // Select all tiles that belong to the same group as the currently selected tile
      const selectTileGroup = () => {
        const selectedArtwork = artworks.find(a => a.id === selectedArt);
        if (!selectedArtwork?.tileGroupId) return;

        const groupTiles = artworks.filter(a => a.tileGroupId === selectedArtwork.tileGroupId);
        setSelectedGroup(groupTiles.map(t => t.id));
      };

      // Clear group selection
      const clearGroupSelection = () => {
        setSelectedGroup([]);
      };

      // Check if selected artwork is part of a tile group
      const selectedArtwork = artworks.find((a) => a.id === selectedArt);
      const isSelectedTile = selectedArtwork?.tileGroupId !== undefined;
      const groupTileCount = isSelectedTile
        ? artworks.filter(a => a.tileGroupId === selectedArtwork.tileGroupId).length
        : 0;

      const adjustSize = (delta) => {
        // If group is selected, resize all tiles in the group uniformly
        const idsToResize = selectedGroup.length > 0 ? selectedGroup : [selectedArt];

        setArtworks((prev) =>
          prev.map((art) => {
            if (idsToResize.includes(art.id)) {
              let newWidth = Math.max(60, art.width + delta);
              if (snapEnabled) newWidth = snapToGridFn(newWidth);
              const newHeight = newWidth / art.aspectRatio;

              // Keep centered when resizing
              const widthDiff = newWidth - art.width;
              const heightDiff = newHeight - art.height;

              return {
                ...art,
                width: newWidth,
                height: newHeight,
                x: art.x - widthDiff / 2,
                y: art.y - heightDiff / 2
              };
            }
            return art;
          })
        );

        // Update master tile size if resizing tiles
        if (selectedGroup.length > 0) {
          const firstTile = artworks.find(a => a.id === selectedGroup[0]);
          if (firstTile) {
            let newWidth = Math.max(60, firstTile.width + delta);
            if (snapEnabled) newWidth = snapToGridFn(newWidth);
            setMasterTileSize({ width: newWidth, height: newWidth / firstTile.aspectRatio });
          }
        }
      };

      // Adjust gap between tiles in the selected group
      const adjustGroupGap = (delta) => {
        if (selectedGroup.length < 2) return;

        // Get the tiles in the group
        const groupTiles = artworks.filter(a => selectedGroup.includes(a.id));
        if (groupTiles.length < 2) return;

        // Find the grid structure (rows and cols based on positions)
        const uniqueXs = [...new Set(groupTiles.map(a => Math.round(a.x)))].sort((a, b) => a - b);
        const uniqueYs = [...new Set(groupTiles.map(a => Math.round(a.y)))].sort((a, b) => a - b);

        const cols = uniqueXs.length;
        const rows = uniqueYs.length;

        // Find the first tile (top-left) as anchor
        const firstTile = groupTiles.reduce((min, t) =>
          (t.y < min.y || (t.y === min.y && t.x < min.x)) ? t : min
        , groupTiles[0]);

        const newGap = Math.max(0, gap + delta);
        setGap(newGap);

        // Reposition all tiles in the group based on new gap
        setArtworks(prev => prev.map(art => {
          if (!selectedGroup.includes(art.id)) return art;

          // Find this tile's grid position
          const col = uniqueXs.indexOf(Math.round(art.x));
          const row = uniqueYs.indexOf(Math.round(art.y));

          if (col === -1 || row === -1) return art;

          // Calculate new position (round to avoid floating-point precision issues)
          const newX = Math.round(firstTile.x + col * (art.width + newGap));
          const newY = Math.round(firstTile.y + row * (art.height + newGap));

          return { ...art, x: newX, y: newY };
        }));
      };

      // Move all tiles in the selected group together
      const moveGroup = (deltaX, deltaY) => {
        if (selectedGroup.length === 0) return;

        setArtworks(prev => prev.map(art => {
          if (!selectedGroup.includes(art.id)) return art;
          return { ...art, x: art.x + deltaX, y: art.y + deltaY };
        }));
      };

      const duplicateSelected = () => {
        const art = artworks.find((a) => a.id === selectedArt);
        if (art) {
          const newX = snapEnabled ? snapToGridFn(art.x + art.width + gap) : art.x + art.width + gap;
          setArtworks((prev) => [...prev, { ...art, id: Date.now(), x: newX }]);
        }
      };

      const resetPerspective = () => {
        setArtworks((prev) =>
          prev.map((art) =>
            art.id === selectedArt
              ? { ...art, rotation: 0, rotateX: 0, rotateY: 0, skewX: 0, skewY: 0 }
              : art
          )
        );
      };

      const applyPerspectiveToAll = () => {
        const art = artworks.find((a) => a.id === selectedArt);
        if (art) {
          const perspective = { rotation: art.rotation, rotateX: art.rotateX, rotateY: art.rotateY, skewX: art.skewX, skewY: art.skewY };
          setArtworks((prev) => prev.map((a) => ({ ...a, ...perspective })));
        }
      };

      // Normalize all tiles to match the master tile size
      // This ensures uniform sizes across all artworks when adding multiple tiled images
      const normalizeAllTilesToSize = (targetWidth, targetHeight) => {
        // Get all tiles (artworks that have tileRow property)
        const tiles = artworks.filter(a => a.tileRow !== undefined);
        if (tiles.length === 0) return;

        // Group tiles by their approximate grid position to maintain layout
        setArtworks(prev => {
          // Find groups of connected tiles (by checking for common grid patterns)
          const tilesWithNewSize = prev.map(art => {
            if (art.tileRow === undefined) return art; // Not a tile, keep as-is

            // Calculate the center of each tile to reposition around it
            const centerX = art.x + art.width / 2;
            const centerY = art.y + art.height / 2;

            // Recalculate position to keep tiles centered at same spot
            const newX = centerX - targetWidth / 2;
            const newY = centerY - targetHeight / 2;

            return {
              ...art,
              width: targetWidth,
              height: targetHeight,
              aspectRatio: targetWidth / targetHeight,
              x: newX,
              y: newY
            };
          });

          return tilesWithNewSize;
        });

        // Update the master tile size
        setMasterTileSize({ width: targetWidth, height: targetHeight });
      };

      // Check if tiles have mixed sizes (for showing warning/normalize button)
      const checkTileUniformity = () => {
        const tiles = artworks.filter(a => a.tileRow !== undefined);
        if (tiles.length < 2) return { uniform: true, tiles: tiles.length };

        const firstTile = tiles[0];
        const hasNonUniform = tiles.some(t =>
          Math.abs(t.width - firstTile.width) > 1 || Math.abs(t.height - firstTile.height) > 1
        );

        return {
          uniform: !hasNonUniform,
          tiles: tiles.length,
          firstWidth: firstTile.width,
          firstHeight: firstTile.height
        };
      };

      const tileUniformity = checkTileUniformity();

      const distributeHorizontally = () => {
        if (artworks.length < 2) return;
        const sorted = [...artworks].sort((a, b) => a.x - b.x);
        const first = sorted[0];
        const last = sorted[sorted.length - 1];
        const totalWidth = (last.x + last.width) - first.x;
        const artWidths = sorted.reduce((sum, a) => sum + a.width, 0);
        const gapBetween = (totalWidth - artWidths) / (sorted.length - 1);

        let currentX = first.x;
        const newPositions = sorted.map((art) => {
          const newArt = { ...art, x: currentX };
          currentX += art.width + gapBetween;
          return newArt;
        });
        setArtworks(newPositions);
      };

      // Calculate total bounding box of all artwork pieces
      // Returns dimensions in inches (assuming 1 pixel = some real-world size)
      // User can set a scale factor via the pixelsPerInch state
      const calculateTotalSize = () => {
        if (artworks.length === 0) return null;

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

        artworks.forEach(art => {
          minX = Math.min(minX, art.x);
          minY = Math.min(minY, art.y);
          maxX = Math.max(maxX, art.x + art.width);
          maxY = Math.max(maxY, art.y + art.height);
        });

        const totalWidthPx = maxX - minX;
        const totalHeightPx = maxY - minY;

        // Calculate individual piece sizes and gaps
        // For tiled artwork, calculate the tile size and gap
        let tileInfo = null;
        if (artworks.length > 1) {
          // Check if tiles have consistent sizes (indicates tiled artwork)
          const firstArt = artworks[0];
          const allSameSize = artworks.every(a =>
            Math.abs(a.width - firstArt.width) < 1 && Math.abs(a.height - firstArt.height) < 1
          );

          if (allSameSize) {
            // Calculate grid layout (rows x cols)
            const uniqueXs = [...new Set(artworks.map(a => Math.round(a.x)))].sort((a, b) => a - b);
            const uniqueYs = [...new Set(artworks.map(a => Math.round(a.y)))].sort((a, b) => a - b);
            const cols = uniqueXs.length;
            const rows = uniqueYs.length;

            // Calculate gap between tiles
            let gapX = 0, gapY = 0;
            if (cols > 1 && uniqueXs.length > 1) {
              gapX = uniqueXs[1] - uniqueXs[0] - firstArt.width;
            }
            if (rows > 1 && uniqueYs.length > 1) {
              gapY = uniqueYs[1] - uniqueYs[0] - firstArt.height;
            }

            tileInfo = {
              cols,
              rows,
              tileWidth: firstArt.width,
              tileHeight: firstArt.height,
              gapX: Math.max(0, gapX),
              gapY: Math.max(0, gapY),
              // Product size = sum of all panel dimensions (no gaps)
              productWidthPx: cols * firstArt.width,
              productHeightPx: rows * firstArt.height
            };
          }
        }

        // Calculate total product size (sum of all panels, excluding gaps)
        let productWidthPx = 0;
        let productHeightPx = 0;
        if (tileInfo) {
          productWidthPx = tileInfo.productWidthPx;
          productHeightPx = tileInfo.productHeightPx;
        } else {
          // For non-tiled artwork, sum up individual piece dimensions
          artworks.forEach(art => {
            productWidthPx += art.width;
            productHeightPx += art.height;
          });
        }

        return {
          totalWidthPx,
          totalHeightPx,
          productWidthPx,
          productHeightPx,
          pieceCount: artworks.length,
          tileInfo
        };
      };

      const totalSizeInfo = calculateTotalSize();

      const getTransformStyle = (art) => {
        const transforms = [];
        if (art.rotation) transforms.push(`rotate(${art.rotation}deg)`);
        if (art.rotateX || art.rotateY) {
          transforms.push(`perspective(800px)`);
          if (art.rotateX) transforms.push(`rotateX(${art.rotateX}deg)`);
          if (art.rotateY) transforms.push(`rotateY(${art.rotateY}deg)`);
        }
        if (art.skewX) transforms.push(`skewX(${art.skewX}deg)`);
        if (art.skewY) transforms.push(`skewY(${art.skewY}deg)`);
        return transforms.join(' ');
      };

      const getFrameClass = (filter) => {
        switch (filter) {
          case 'metal': return 'frame-metal';
          case 'canvas': return 'frame-canvas';
          default: return 'frame-metal';
        }
      };

      // Inverse scale for handles so they stay same size visually
      const handleScale = 1 / zoom;

      const exportImage = (sendToParent = false) => {
        const roomImg = roomRef.current;
        if (!roomImg) return;

        const canvas = document.createElement('canvas');
        canvas.width = roomSize.width;
        canvas.height = roomSize.height;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0);

          const loadPromises = artworks.map((art) => {
            return new Promise((resolve) => {
              const artImg = new Image();
              artImg.crossOrigin = 'anonymous';
              artImg.onload = () => resolve({ img: artImg, art });
              artImg.onerror = () => resolve(null);
              artImg.src = art.src;
            });
          });

          Promise.all(loadPromises).then((results) => {
            results.forEach((result) => {
              if (!result) return;
              const { img: artImg, art } = result;
              
              const scaleX = roomSize.width / roomRef.current.width;
              const scaleY = roomSize.height / roomRef.current.height;
              
              const x = art.x * scaleX;
              const y = art.y * scaleY;
              const w = art.width * scaleX;
              const h = art.height * scaleY;
              const frame = art.filter === 'canvas' ? 4 * scaleX : 6 * scaleX;
              const centerX = x + w / 2;
              const centerY = y + h / 2;

              ctx.save();
              ctx.translate(centerX, centerY);
              
              // Apply rotation
              if (art.rotation) {
                ctx.rotate(art.rotation * Math.PI / 180);
              }
              
              // Convert 3D perspective rotations to 2D skew approximation
              // rotateY creates horizontal perspective (like looking from side)
              // rotateX creates vertical perspective (like looking from above/below)
              let skewXTotal = art.skewX || 0;
              let skewYTotal = art.skewY || 0;
              let scaleXFactor = 1;
              let scaleYFactor = 1;
              
              // Approximate rotateY with horizontal skew and scale
              if (art.rotateY) {
                const rotateYRad = art.rotateY * Math.PI / 180;
                skewYTotal += art.rotateY * 0.5; // Approximate skew
                scaleXFactor *= Math.cos(rotateYRad); // Foreshortening
              }
              
              // Approximate rotateX with vertical skew and scale
              if (art.rotateX) {
                const rotateXRad = art.rotateX * Math.PI / 180;
                skewXTotal += art.rotateX * 0.5; // Approximate skew
                scaleYFactor *= Math.cos(rotateXRad); // Foreshortening
              }
              
              // Apply combined transform matrix
              // transform(scaleX, skewY, skewX, scaleY, translateX, translateY)
              ctx.transform(
                scaleXFactor,
                Math.tan(skewYTotal * Math.PI / 180),
                Math.tan(skewXTotal * Math.PI / 180),
                scaleYFactor,
                0,
                0
              );

              ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
              ctx.shadowBlur = 20 * scaleX;
              ctx.shadowOffsetX = 8 * scaleX;
              ctx.shadowOffsetY = 8 * scaleY;

              // Only draw frame/border for non-tiled artwork
              // Tiled artwork (split panels) should not have individual borders
              const isTiledArtwork = (art.tileRow != null) || (art.tileCol != null) || (art.tileGroupId != null);
              console.log('[Export] Drawing art:', art.id, 'isTiled:', isTiledArtwork, 'tileRow:', art.tileRow, 'tileCol:', art.tileCol);
              if (!isTiledArtwork) {
                ctx.fillStyle = art.filter === 'canvas' ? '#2a2520' : '#1a1a1a';
                ctx.fillRect(-w/2 - frame, -h/2 - frame, w + frame * 2, h + frame * 2);
              }

              ctx.shadowColor = 'transparent';

              const tempCanvas = document.createElement('canvas');
              tempCanvas.width = w;
              tempCanvas.height = h;
              const tempCtx = tempCanvas.getContext('2d');
              
              tempCtx.drawImage(artImg, 0, 0, w, h);
              
              if (art.filter === 'metal') {
                tempCtx.filter = 'saturate(1.4) contrast(1.15) brightness(1.05)';
                tempCtx.drawImage(tempCanvas, 0, 0);
                tempCtx.filter = 'none';
                
                const gradient = tempCtx.createLinearGradient(0, 0, w, h);
                gradient.addColorStop(0, 'rgba(255,255,255,0)');
                gradient.addColorStop(0.25, 'rgba(255,255,255,0.08)');
                gradient.addColorStop(0.5, 'rgba(255,255,255,0.15)');
                gradient.addColorStop(0.75, 'rgba(255,255,255,0.08)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                tempCtx.fillStyle = gradient;
                tempCtx.globalCompositeOperation = 'overlay';
                tempCtx.fillRect(0, 0, w, h);
                tempCtx.globalCompositeOperation = 'source-over';
              } else if (art.filter === 'canvas') {
                tempCtx.filter = 'saturate(0.9) contrast(0.95) brightness(0.98)';
                tempCtx.drawImage(tempCanvas, 0, 0);
                tempCtx.filter = 'none';
                
                tempCtx.globalCompositeOperation = 'multiply';
                tempCtx.fillStyle = 'rgba(245, 240, 230, 0.1)';
                tempCtx.fillRect(0, 0, w, h);
                tempCtx.globalCompositeOperation = 'source-over';
                
                tempCtx.globalAlpha = 0.08;
                for (let i = 0; i < w; i += 3) {
                  tempCtx.fillStyle = 'rgba(0,0,0,0.3)';
                  tempCtx.fillRect(i, 0, 1, h);
                }
                for (let j = 0; j < h; j += 3) {
                  tempCtx.fillRect(0, j, w, 1);
                }
                tempCtx.globalAlpha = 1;
              }

              ctx.drawImage(tempCanvas, -w/2, -h/2, w, h);
              ctx.restore();
            });

            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
            const filename = 'room-mockup.jpg';

            if (sendToParent && window.parent !== window) {
              // Send to parent window via postMessage
              // Include all artwork sources for saving tiled versions
              const artworkSources = artworks.map((art, idx) => ({
                index: idx,
                src: art.src,
                x: art.x,
                y: art.y,
                width: art.width,
                height: art.height,
                tileRow: art.tileRow,
                tileCol: art.tileCol,
                tileGroupId: art.tileGroupId
              }));

              // Calculate product size info to send to parent
              const sizeInfo = calculateTotalSize();
              const productSizeInfo = sizeInfo ? {
                // Product size = sum of panels (what you're actually getting)
                productWidth: (sizeInfo.productWidthPx / pixelsPerInch).toFixed(1),
                productHeight: (sizeInfo.productHeightPx / pixelsPerInch).toFixed(1),
                // Wall coverage = bounding box including gaps
                wallWidth: (sizeInfo.totalWidthPx / pixelsPerInch).toFixed(1),
                wallHeight: (sizeInfo.totalHeightPx / pixelsPerInch).toFixed(1),
                pieceCount: sizeInfo.pieceCount,
                tileInfo: sizeInfo.tileInfo ? {
                  cols: sizeInfo.tileInfo.cols,
                  rows: sizeInfo.tileInfo.rows,
                  tileWidth: (sizeInfo.tileInfo.tileWidth / pixelsPerInch).toFixed(1),
                  tileHeight: (sizeInfo.tileInfo.tileHeight / pixelsPerInch).toFixed(1),
                  gapX: (sizeInfo.tileInfo.gapX / pixelsPerInch).toFixed(1),
                  gapY: (sizeInfo.tileInfo.gapY / pixelsPerInch).toFixed(1)
                } : null,
                pixelsPerInch
              } : null;

              window.parent.postMessage({
                type: 'MOCKUP_EXPORTED',
                dataUrl,
                filename,
                artworks: artworkSources,
                productSizeInfo,
                roomImage,
                roomSize
              }, '*');
            } else {
              // Download locally
              const link = document.createElement('a');
              link.download = filename;
              link.href = dataUrl;
              link.click();
            }
          });
        };
        img.crossOrigin = 'anonymous';
        img.src = roomImage;
      };

      const renderGrid = () => {
        if (!showGrid || !roomRef.current) return null;
        const width = roomRef.current.width;
        const height = roomRef.current.height;
        
        const lines = [];
        for (let x = 0; x < width; x += gridSize) {
          lines.push(<line key={`v${x}`} x1={x} y1={0} x2={x} y2={height} stroke="#fff" strokeWidth={0.5 / zoom} />);
        }
        for (let y = 0; y < height; y += gridSize) {
          lines.push(<line key={`h${y}`} x1={0} y1={y} x2={width} y2={y} stroke="#fff" strokeWidth={0.5 / zoom} />);
        }
        
        return (
          <svg className="grid-overlay" style={{ width: '100%', height: '100%', position: 'absolute', top: 0, left: 0 }}>{lines}</svg>
        );
      };

      return (
        <div className="container">
          <h1>🖼️ Wall Art Mockup Tool</h1>

          <div className="controls">
            <label className="btn btn-blue">
              📷 Room
              <input type="file" accept="image/*" onChange={handleRoomUpload} className="hidden-input" />
            </label>

            {roomImage && (
              <button onClick={openArtworkModal} className="btn btn-green">
                🖼️ Add Art
              </button>
            )}

            {roomImage && (
              <>
                <div className="zoom-control">
                  <button onClick={() => handleZoom(-0.25)}>−</button>
                  <label>🔍</label>
                  <input 
                    type="range" 
                    min="0.25" 
                    max="4" 
                    step="0.05" 
                    value={zoom} 
                    onChange={(e) => setZoom(Number(e.target.value))} 
                  />
                  <span className="zoom-value">{Math.round(zoom * 100)}%</span>
                  <button onClick={() => handleZoom(0.25)}>+</button>
                </div>
                
                <div className="control-group">
                  <input type="checkbox" checked={snapEnabled} onChange={(e) => setSnapEnabled(e.target.checked)} id="snapGrid" />
                  <label htmlFor="snapGrid">Snap</label>
                </div>
                <div className="control-group">
                  <input type="checkbox" checked={snapToArt} onChange={(e) => setSnapToArt(e.target.checked)} id="snapArt" />
                  <label htmlFor="snapArt">to Art</label>
                </div>
                <div className="control-group">
                  <input type="checkbox" checked={showGrid} onChange={(e) => setShowGrid(e.target.checked)} id="showGrid" />
                  <label htmlFor="showGrid">Grid</label>
                </div>
                <div className="control-group">
                  <label>Gap:</label>
                  <input type="number" className="num-input" min="0" max="100" value={gap} onChange={(e) => setGap(Number(e.target.value))} />
                </div>
              </>
            )}

            {artworks.length > 0 && (
              <button onClick={exportImage} className="btn btn-orange">💾 Export</button>
            )}
          </div>

          {/* Total Size Info Panel - shows when artwork is present */}
          {totalSizeInfo && artworks.length > 0 && (
            <div className="panel" style={{ marginTop: '12px', padding: '12px 16px', background: '#1a2a1a', border: '1px solid #3a5' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                  {/* Product Size - sum of all panels (most important) */}
                  <div>
                    <div style={{ fontSize: '11px', color: '#888', marginBottom: '2px' }}>Product Size (panels)</div>
                    <div style={{ fontSize: '20px', fontWeight: 'bold', color: '#fa9' }}>
                      {(totalSizeInfo.productWidthPx / pixelsPerInch).toFixed(1)}" × {(totalSizeInfo.productHeightPx / pixelsPerInch).toFixed(1)}"
                    </div>
                  </div>
                  <div style={{ borderLeft: '1px solid #444', height: '36px' }} />
                  {/* Wall Coverage - bounding box including gaps */}
                  <div>
                    <div style={{ fontSize: '11px', color: '#888', marginBottom: '2px' }}>Wall Coverage</div>
                    <div style={{ fontSize: '16px', color: '#4a9' }}>
                      {(totalSizeInfo.totalWidthPx / pixelsPerInch).toFixed(1)}" × {(totalSizeInfo.totalHeightPx / pixelsPerInch).toFixed(1)}"
                    </div>
                  </div>
                  {totalSizeInfo.tileInfo && (
                    <>
                      <div style={{ borderLeft: '1px solid #444', height: '36px' }} />
                      <div>
                        <div style={{ fontSize: '11px', color: '#888', marginBottom: '2px' }}>Grid Layout</div>
                        <div style={{ fontSize: '16px', color: '#9af' }}>
                          {totalSizeInfo.tileInfo.cols} × {totalSizeInfo.tileInfo.rows} ({totalSizeInfo.pieceCount} panels)
                        </div>
                      </div>
                      <div style={{ borderLeft: '1px solid #444', height: '36px' }} />
                      <div>
                        <div style={{ fontSize: '11px', color: '#888', marginBottom: '2px' }}>Each Panel</div>
                        <div style={{ fontSize: '16px', color: '#fa9' }}>
                          {(totalSizeInfo.tileInfo.tileWidth / pixelsPerInch).toFixed(1)}" × {(totalSizeInfo.tileInfo.tileHeight / pixelsPerInch).toFixed(1)}"
                        </div>
                      </div>
                      {(totalSizeInfo.tileInfo.gapX > 0 || totalSizeInfo.tileInfo.gapY > 0) && (
                        <>
                          <div style={{ borderLeft: '1px solid #444', height: '36px' }} />
                          <div>
                            <div style={{ fontSize: '11px', color: '#888', marginBottom: '2px' }}>Gap</div>
                            <div style={{ fontSize: '16px', color: '#aaa' }}>
                              {(Math.max(totalSizeInfo.tileInfo.gapX, totalSizeInfo.tileInfo.gapY) / pixelsPerInch).toFixed(1)}"
                            </div>
                          </div>
                        </>
                      )}
                    </>
                  )}
                  {!totalSizeInfo.tileInfo && totalSizeInfo.pieceCount > 1 && (
                    <>
                      <div style={{ borderLeft: '1px solid #444', height: '36px' }} />
                      <div>
                        <div style={{ fontSize: '11px', color: '#888', marginBottom: '2px' }}>Pieces</div>
                        <div style={{ fontSize: '16px', color: '#9af' }}>{totalSizeInfo.pieceCount}</div>
                      </div>
                    </>
                  )}
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <label style={{ fontSize: '11px', color: '#888' }}>Scale (px/in):</label>
                  <input
                    type="number"
                    className="num-input"
                    min="1"
                    max="100"
                    value={pixelsPerInch}
                    onChange={(e) => setPixelsPerInch(Math.max(1, Number(e.target.value) || 10))}
                    style={{ width: '50px' }}
                  />
                </div>
              </div>
            </div>
          )}

          {/* Tile Size Controls - shows when tiles are present */}
          {tileUniformity.tiles > 0 && (
            <div className="panel" style={{ marginTop: '8px', padding: '12px 16px', background: '#1a1a2a', border: '1px solid #59f' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                  <div>
                    <div style={{ fontSize: '11px', color: '#888', marginBottom: '2px' }}>Uniform Tile Size</div>
                    <div style={{ fontSize: '14px', color: tileUniformity.uniform ? '#4a9' : '#f94' }}>
                      {tileUniformity.uniform ? '✓ All tiles uniform' : '⚠ Mixed tile sizes detected'}
                    </div>
                  </div>
                  <div style={{ borderLeft: '1px solid #444', height: '36px' }} />
                  <div>
                    <div style={{ fontSize: '11px', color: '#888', marginBottom: '2px' }}>Master Tile Size (px)</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                      <input
                        type="number"
                        className="num-input"
                        min="50"
                        max="500"
                        value={Math.round(masterTileSize.width)}
                        onChange={(e) => setMasterTileSize(prev => ({ ...prev, width: Math.max(50, Number(e.target.value) || 100) }))}
                        style={{ width: '60px' }}
                      />
                      <span style={{ color: '#666' }}>×</span>
                      <input
                        type="number"
                        className="num-input"
                        min="50"
                        max="500"
                        value={Math.round(masterTileSize.height)}
                        onChange={(e) => setMasterTileSize(prev => ({ ...prev, height: Math.max(50, Number(e.target.value) || 100) }))}
                        style={{ width: '60px' }}
                      />
                    </div>
                  </div>
                  <div style={{ borderLeft: '1px solid #444', height: '36px' }} />
                  <div>
                    <div style={{ fontSize: '11px', color: '#888', marginBottom: '2px' }}>In Inches</div>
                    <div style={{ fontSize: '14px', color: '#9af' }}>
                      {(masterTileSize.width / pixelsPerInch).toFixed(1)}" × {(masterTileSize.height / pixelsPerInch).toFixed(1)}"
                    </div>
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <button
                    onClick={() => normalizeAllTilesToSize(masterTileSize.width, masterTileSize.height)}
                    className="btn btn-blue btn-sm"
                    title="Apply master tile size to all tiles"
                  >
                    📐 Apply to All Tiles
                  </button>
                  {!tileUniformity.uniform && (
                    <button
                      onClick={() => normalizeAllTilesToSize(tileUniformity.firstWidth, tileUniformity.firstHeight)}
                      className="btn btn-orange btn-sm"
                      title="Make all tiles match the first tile's size"
                    >
                      ⚡ Match First Tile
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {selectedArt && selectedArtwork && (
            <>
              <div className="controls">
                <button onClick={(e) => { e.stopPropagation(); adjustSize(30); }} className="btn btn-purple btn-sm">➕ Bigger</button>
                <button onClick={(e) => { e.stopPropagation(); adjustSize(-30); }} className="btn btn-purple btn-sm">➖ Smaller</button>
                <button onClick={(e) => { e.stopPropagation(); duplicateSelected(); }} className="btn btn-yellow btn-sm">📋 Duplicate</button>
                <button onClick={(e) => { e.stopPropagation(); e.preventDefault(); openTileModal(e); }} className="btn btn-blue btn-sm">🔲 Tile/Split</button>
                <button onClick={(e) => { e.stopPropagation(); deleteSelected(); }} className="btn btn-red btn-sm">🗑️ Delete</button>
                {artworks.length > 1 && (
                  <button onClick={(e) => { e.stopPropagation(); distributeHorizontally(); }} className="btn btn-teal btn-sm">⬌ Distribute</button>
                )}
                {/* Show Select Group button when a tile is selected */}
                {isSelectedTile && selectedGroup.length === 0 && groupTileCount > 1 && (
                  <button onClick={(e) => { e.stopPropagation(); selectTileGroup(); }} className="btn btn-cyan btn-sm" title={`Select all ${groupTileCount} tiles in this group`}>
                    🔗 Select Group ({groupTileCount})
                  </button>
                )}
              </div>

              {/* Group Controls - shows when a tile group is selected */}
              {selectedGroup.length > 1 && (
                <div className="panel" style={{ marginTop: '8px', padding: '12px 16px', background: '#2a1a2a', border: '1px solid #a5f' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                      <div>
                        <div style={{ fontSize: '11px', color: '#888', marginBottom: '2px' }}>Group Selected</div>
                        <div style={{ fontSize: '16px', fontWeight: 'bold', color: '#a5f' }}>
                          {selectedGroup.length} tiles selected
                        </div>
                      </div>
                      <div style={{ borderLeft: '1px solid #444', height: '36px' }} />
                      <div>
                        <div style={{ fontSize: '11px', color: '#888', marginBottom: '4px' }}>Gap Between Tiles</div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                          <button onClick={(e) => { e.stopPropagation(); adjustGroupGap(-5); }} className="btn btn-gray btn-sm">−</button>
                          <span style={{ color: '#fff', minWidth: '40px', textAlign: 'center' }}>{gap.toFixed(0)}px</span>
                          <button onClick={(e) => { e.stopPropagation(); adjustGroupGap(5); }} className="btn btn-gray btn-sm">+</button>
                        </div>
                      </div>
                      <div style={{ borderLeft: '1px solid #444', height: '36px' }} />
                      <div>
                        <div style={{ fontSize: '11px', color: '#888', marginBottom: '4px' }}>Move Group</div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
                          <button onClick={(e) => { e.stopPropagation(); moveGroup(-10, 0); }} className="btn btn-gray btn-sm">←</button>
                          <button onClick={(e) => { e.stopPropagation(); moveGroup(0, -10); }} className="btn btn-gray btn-sm">↑</button>
                          <button onClick={(e) => { e.stopPropagation(); moveGroup(0, 10); }} className="btn btn-gray btn-sm">↓</button>
                          <button onClick={(e) => { e.stopPropagation(); moveGroup(10, 0); }} className="btn btn-gray btn-sm">→</button>
                        </div>
                      </div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <button onClick={(e) => { e.stopPropagation(); deleteSelected(); }} className="btn btn-red btn-sm" title="Delete all tiles in group">
                        🗑️ Delete Group
                      </button>
                      <button onClick={(e) => { e.stopPropagation(); clearGroupSelection(); }} className="btn btn-gray btn-sm">
                        ✕ Deselect
                      </button>
                    </div>
                  </div>
                </div>
              )}

              <div className="two-columns">
                <div className="panel">
                  <h3>🎨 Print Type / Filter</h3>
                  <div className="filter-buttons">
                    {filters.map((filter) => (
                      <button
                        key={filter.id}
                        className={`filter-btn ${selectedArtwork.filter === filter.id ? 'active' : ''}`}
                        onClick={() => setFilter(filter.id)}
                      >
                        <span className="icon">{filter.icon}</span>
                        {filter.name}
                      </button>
                    ))}
                  </div>
                  <div style={{ marginTop: '10px', textAlign: 'center' }}>
                    <button onClick={() => applyFilterToAll(selectedArtwork.filter)} className="btn btn-teal btn-sm">
                      Apply to All Artwork
                    </button>
                  </div>
                  <div className="info-text">
                    {selectedArtwork.filter === 'metal' && '✨ Metal: Vibrant colors, high contrast, metallic sheen'}
                    {selectedArtwork.filter === 'canvas' && '🎨 Canvas: Soft texture, muted tones, gallery wrap'}
                    {selectedArtwork.filter === 'none' && '🖼️ None: Original image, standard frame'}
                  </div>
                </div>

                <div className="panel">
                  <h3>📐 Perspective & Angle</h3>
                  <div className="panel-controls">
                    <div className="panel-control">
                      <label>Rotation</label>
                      <input type="range" min="-45" max="45" value={selectedArtwork.rotation} onChange={(e) => updateArtwork('rotation', Number(e.target.value))} />
                      <span className="value">{selectedArtwork.rotation}°</span>
                    </div>
                    <div className="panel-control">
                      <label>Tilt X</label>
                      <input type="range" min="-30" max="30" value={selectedArtwork.rotateX} onChange={(e) => updateArtwork('rotateX', Number(e.target.value))} />
                      <span className="value">{selectedArtwork.rotateX}°</span>
                    </div>
                    <div className="panel-control">
                      <label>Tilt Y</label>
                      <input type="range" min="-30" max="30" value={selectedArtwork.rotateY} onChange={(e) => updateArtwork('rotateY', Number(e.target.value))} />
                      <span className="value">{selectedArtwork.rotateY}°</span>
                    </div>
                    <div className="panel-control">
                      <label>Skew X</label>
                      <input type="range" min="-20" max="20" value={selectedArtwork.skewX} onChange={(e) => updateArtwork('skewX', Number(e.target.value))} />
                      <span className="value">{selectedArtwork.skewX}°</span>
                    </div>
                    <div className="panel-control">
                      <label>Skew Y</label>
                      <input type="range" min="-20" max="20" value={selectedArtwork.skewY} onChange={(e) => updateArtwork('skewY', Number(e.target.value))} />
                      <span className="value">{selectedArtwork.skewY}°</span>
                    </div>
                  </div>
                  <div style={{ marginTop: '10px', display: 'flex', gap: '5px', justifyContent: 'center', flexWrap: 'wrap' }}>
                    <button onClick={resetPerspective} className="btn btn-gray btn-sm">↺ Reset</button>
                    <button onClick={applyPerspectiveToAll} className="btn btn-teal btn-sm">Apply to All</button>
                  </div>
                </div>
              </div>
            </>
          )}

          {!roomImage && (
            <div className="placeholder">
              <p className="big">👆 Start by uploading a room photo</p>
              <p>Then add your artwork images and drag them into position</p>
              <p style={{ marginTop: '20px', fontSize: '13px' }}>
                ✨ Use zoom (Ctrl + scroll or slider) to get close-up while editing!
              </p>
              <p style={{ marginTop: '20px', fontSize: '11px', color: '#888' }}>
                Debug: {debugMsg}
              </p>
            </div>
          )}

          {roomImage && (
            <>
              <div
                ref={wrapperRef}
                className="canvas-wrapper"
                onWheel={handleWheel}
              >
                <div
                  ref={containerRef}
                  className="canvas-area"
                  style={{ transform: `scale(${zoom})` }}
                  onMouseMove={handleMouseMove}
                  onMouseUp={handleMouseUp}
                  onMouseLeave={handleMouseUp}
                  onClick={handleCanvasClick}
                >
                  <img ref={roomRef} src={roomImage} alt="Room" className="room-image" draggable={false} />
                  
                  {renderGrid()}
                  
                  {snapLines.horizontal.map((y, i) => (
                    <div key={`h${i}`} className="snap-indicator horizontal" style={{ top: y, height: 2 / zoom }} />
                  ))}
                  {snapLines.vertical.map((x, i) => (
                    <div key={`v${i}`} className="snap-indicator vertical" style={{ left: x, width: 2 / zoom }} />
                  ))}

                  {artworks.map((art) => {
                    const isInSelectedGroup = selectedGroup.includes(art.id);
                    const isSelected = selectedArt === art.id;

                    return (
                    <div
                      key={art.id}
                      className={`artwork ${isSelected ? 'selected' : ''} ${isInSelectedGroup ? 'group-selected' : ''}`}
                      style={{
                        left: art.x,
                        top: art.y,
                        width: art.width,
                        height: art.height,
                        transform: getTransformStyle(art),
                        outlineWidth: isSelected ? 3 / zoom : (isInSelectedGroup ? 2 / zoom : 0),
                        outlineColor: isInSelectedGroup && !isSelected ? '#a855f7' : undefined,
                        outlineStyle: isInSelectedGroup && !isSelected ? 'dashed' : undefined,
                      }}
                      onMouseDown={(e) => handleMouseDown(e, art, 'drag')}
                    >
                      {selectedArt === art.id && (
                        <div 
                          className="size-info" 
                          style={{ 
                            transform: `translateX(-50%) scale(${handleScale})`,
                            transformOrigin: 'bottom center',
                          }}
                        >
                          {Math.round(art.width)} × {Math.round(art.height)} • {filters.find(f => f.id === art.filter)?.name}
                        </div>
                      )}
                      <div className={`artwork-inner ${getFrameClass(art.filter)} filter-${art.filter}`}>
                        <img src={art.src} alt="Artwork" draggable={false} />
                        {art.filter === 'metal' && (
                          <>
                            <div className="metal-sheen" />
                            <div className="metal-edge-highlight" />
                          </>
                        )}
                        {art.filter === 'canvas' && (
                          <>
                            <div className="canvas-texture" />
                            <div className="canvas-weave" />
                            <div className="canvas-depth" />
                          </>
                        )}
                      </div>
                      {selectedArt === art.id && (
                        <>
                          <div 
                            className="rotate-line" 
                            style={{ 
                              transform: `translateX(-50%) scaleY(${handleScale})`,
                              top: -20 * handleScale,
                              height: 20 * handleScale,
                              width: 2 / zoom,
                            }} 
                          />
                          <div
                            className="rotate-handle"
                            style={{
                              transform: `translateX(-50%) scale(${handleScale})`,
                              top: -30 * handleScale,
                            }}
                            onMouseDown={(e) => handleMouseDown(e, art, 'rotate')}
                            title="Drag to rotate"
                          />
                          <div
                            className="resize-handle"
                            style={{
                              transform: `scale(${handleScale})`,
                              bottom: -10 * handleScale,
                              right: -10 * handleScale,
                            }}
                            onMouseDown={(e) => handleMouseDown(e, art, 'resize')}
                            title="Drag to resize"
                          />
                        </>
                      )}
                    </div>
                  );
                  })}
                </div>
              </div>

              <div className="tips">
                💡 Ctrl + Scroll to zoom • Drag to move • Handles stay same size at any zoom level
              </div>
            </>
          )}

          {/* Artwork Database Modal */}
          {showArtworkModal && (
            <div
              className="artwork-modal-overlay"
              onClick={(e) => { if (e.target === e.currentTarget) setShowArtworkModal(false); }}
              onMouseDown={(e) => e.stopPropagation()}
            >
              <div className="artwork-modal" onClick={(e) => e.stopPropagation()}>
                <div className="artwork-modal-header">
                  <h2>Select Artwork from Database</h2>
                  <button className="artwork-modal-close" onClick={() => setShowArtworkModal(false)}>×</button>
                </div>
                <div className="artwork-modal-body">
                  {loadingDbArtworks ? (
                    <div className="artwork-modal-loading">Loading artwork...</div>
                  ) : dbArtworks.length === 0 ? (
                    <div className="artwork-modal-loading">No artwork found in database</div>
                  ) : (
                    <div className="artwork-grid">
                      {dbArtworks.map((art) => (
                        <div
                          key={art.id || art.url}
                          className={`artwork-item ${selectedDbArtwork?.id === art.id ? 'selected' : ''}`}
                          onClick={() => setSelectedDbArtwork(art)}
                        >
                          <img
                            src={art.thumbnail || art.url}
                            alt={art.name || 'Artwork'}
                            crossOrigin="anonymous"
                            onError={(e) => {
                              console.error('[Mockup] Failed to load thumbnail:', art.thumbnail || art.url);
                              e.target.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 75"><rect fill="%231a1a2e" width="100" height="75"/><text x="50" y="40" fill="%23f66" text-anchor="middle" font-size="8">Load Error</text></svg>';
                            }}
                            onLoad={() => console.log('[Mockup] Loaded:', art.thumbnail || art.url)}
                          />
                          <div className="artwork-item-name">{art.name || 'Untitled'}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div className="artwork-modal-footer">
                  <button className="btn btn-gray" onClick={() => setShowArtworkModal(false)}>Cancel</button>
                  <button
                    className="btn btn-green"
                    onClick={addDbArtworkToCanvas}
                    disabled={!selectedDbArtwork}
                  >
                    Add to Canvas
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Tile/Split Modal */}
          {showTileModal && (
            <div
              className="artwork-modal-overlay"
              onClick={(e) => {
                console.log('[Mockup] Tile overlay onClick, target className:', e.target?.className, 'currentTarget className:', e.currentTarget?.className);
                // Only close if the click was directly on the overlay (not bubbled from children)
                if (e.target === e.currentTarget && e.target.classList.contains('artwork-modal-overlay')) {
                  console.log('[Mockup] Closing tile modal from direct overlay click');
                  setShowTileModal(false);
                }
              }}
              onMouseDown={(e) => {
                console.log('[Mockup] Tile overlay onMouseDown');
                e.stopPropagation();
              }}
            >
              <div className="artwork-modal" style={{ maxWidth: '500px' }} onClick={(e) => e.stopPropagation()}>
                <div className="artwork-modal-header">
                  <h2>Tile/Split Artwork</h2>
                  <button className="artwork-modal-close" onClick={() => setShowTileModal(false)}>×</button>
                </div>
                <div className="artwork-modal-body" onClick={(e) => e.stopPropagation()}>
                  <p style={{ textAlign: 'center', color: '#888', marginBottom: '20px' }}>
                    Split the selected artwork into a grid of tiles
                  </p>
                  <div className="tile-config" onClick={(e) => e.stopPropagation()}>
                    <label onClick={(e) => e.stopPropagation()}>
                      Columns:
                      <input
                        type="number"
                        min="1"
                        max="10"
                        value={tileCols}
                        onClick={(e) => e.stopPropagation()}
                        onMouseDown={(e) => e.stopPropagation()}
                        onChange={(e) => setTileCols(Math.max(1, Math.min(10, parseInt(e.target.value) || 1)))}
                      />
                    </label>
                    <label onClick={(e) => e.stopPropagation()}>
                      Rows:
                      <input
                        type="number"
                        min="1"
                        max="10"
                        value={tileRows}
                        onClick={(e) => e.stopPropagation()}
                        onMouseDown={(e) => e.stopPropagation()}
                        onChange={(e) => setTileRows(Math.max(1, Math.min(10, parseInt(e.target.value) || 1)))}
                      />
                    </label>
                    <div
                      className="tile-preview"
                      style={{
                        gridTemplateColumns: `repeat(${tileCols}, 1fr)`,
                        gridTemplateRows: `repeat(${tileRows}, 1fr)`
                      }}
                    >
                      {Array.from({ length: tileCols * tileRows }).map((_, i) => (
                        <div key={i} className="tile-preview-cell" />
                      ))}
                    </div>
                  </div>

                  {/* Tile Size / Aspect Ratio */}
                  <div style={{ marginTop: '20px', padding: '12px', background: '#222', borderRadius: '8px' }}>
                    <div style={{ fontSize: '12px', color: '#888', marginBottom: '10px', textAlign: 'center' }}>
                      Tile Size (determines aspect ratio)
                    </div>
                    <div className="tile-config" onClick={(e) => e.stopPropagation()}>
                      <label onClick={(e) => e.stopPropagation()}>
                        Width:
                        <input
                          type="number"
                          min="1"
                          max="100"
                          value={tileSizeWidth}
                          onClick={(e) => e.stopPropagation()}
                          onMouseDown={(e) => e.stopPropagation()}
                          onChange={(e) => setTileSizeWidth(Math.max(1, Math.min(100, parseFloat(e.target.value) || 12)))}
                        />
                        <span style={{ color: '#666', marginLeft: '4px' }}>"</span>
                      </label>
                      <label onClick={(e) => e.stopPropagation()}>
                        Height:
                        <input
                          type="number"
                          min="1"
                          max="100"
                          value={tileSizeHeight}
                          onClick={(e) => e.stopPropagation()}
                          onMouseDown={(e) => e.stopPropagation()}
                          onChange={(e) => setTileSizeHeight(Math.max(1, Math.min(100, parseFloat(e.target.value) || 12)))}
                        />
                        <span style={{ color: '#666', marginLeft: '4px' }}>"</span>
                      </label>
                    </div>
                    <div style={{ fontSize: '11px', color: '#666', marginTop: '8px', textAlign: 'center' }}>
                      Ratio: {(tileSizeWidth / tileSizeHeight).toFixed(2)} ({tileSizeWidth}" × {tileSizeHeight}" each)
                    </div>
                  </div>

                  <p style={{ textAlign: 'center', color: '#666', marginTop: '16px', fontSize: '12px' }}>
                    This will create {tileCols * tileRows} separate tile images
                  </p>
                </div>
                <div className="artwork-modal-footer">
                  <button className="btn btn-gray" onClick={() => setShowTileModal(false)}>Cancel</button>
                  <button className="btn btn-blue" onClick={tileSelectedArtwork}>
                    Split into {tileCols * tileRows} Tiles
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    console.log('[Mockup] Calling ReactDOM.render...');
    ReactDOM.render(<WallArtMockup />, document.getElementById('root'));
    console.log('[Mockup] ReactDOM.render complete');
  </script>
</body>
</html>

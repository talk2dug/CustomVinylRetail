    <text x="135" y="125" fill="#ef4444" font-size="48" font-family="Montserrat, 'Barlow', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="2">CREW CHIEF</text>
    <text x="135" y="185" fill="#e2e8f0" font-size="64" font-family="Montserrat, 'Barlow', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="4">SWAYZE</text>
    <text x="135" y="235" fill="#e2e8f0" font-size="44" font-family="Montserrat, 'Barlow', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="3">RALLY TEAM</text>
    <g fill="#e2e8f0" transform="translate(60 250)">
      <polygon points="0 0 100 0 110 -18 10 -18" opacity=".85"/>
      <polygon points="15 24 115 24 125 6 25 6" opacity=".6"/>
      <polygon points="30 48 130 48 140 30 40 30" opacity=".4"/>
    </g>
    <g transform="translate(40 270)">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
  <title id="title">Swayze Rally Team crew chief tee mockup</title>
  <desc id="desc">Front and back view of a black crew tee that reads Swayze Rally Team, with the back featuring large branding, stripes, a rally car illustration, and Crew Chief lettering.</desc>
  <defs>
    <linearGradient id="shirtHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <g transform="translate(70 40)">
    <path d="M30 36L0 74v268h210V74l-30-38h-55L107 0H93L83 36Z" fill="url(#shirtHighlight)"/>
    <text x="82" y="110" fill="#e2e8f0" font-size="42" font-family="Montserrat, 'Barlow', sans-serif" font-weight="700" text-anchor="middle">SWAYZE</text>
    <text x="82" y="150" fill="#e2e8f0" font-size="28" font-family="Montserrat, 'Barlow', sans-serif" font-weight="600" text-anchor="middle">RALLY TEAM</text>
    <text x="82" y="185" fill="#e2e8f0" font-size="18" font-family="Montserrat, 'Barlow', sans-serif" text-anchor="middle">FRONT</text>
  </g>

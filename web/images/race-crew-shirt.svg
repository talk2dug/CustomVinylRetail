      <path d="M30 75c0-18 14-32 32-32s32 14 32 32" fill="#111827"/>
      <path d="M150 75c0-18 14-32 32-32s32 14 32 32" fill="#111827"/>
      <circle cx="62" cy="75" r="14" fill="#e2e8f0"/>
      <circle cx="182" cy="75" r="14" fill="#e2e8f0"/>
      <rect x="70" y="12" width="90" height="22" rx="8" fill="#111827"/>
      <rect x="92" y="-2" width="64" height="14" rx="6" fill="#e2e8f0"/>

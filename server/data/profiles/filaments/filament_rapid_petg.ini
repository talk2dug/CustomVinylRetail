# PrusaSlicer Filament Profile — Rapid PETG (High-Speed)
# High-flow PETG: 240°C hotend, 80°C bed, designed for fast printing

filament_type = PETG
temperature = 240
first_layer_temperature = 245
bed_temperature = 80
first_layer_bed_temperature = 85
fan_always_on = 1
min_fan_speed = 60
max_fan_speed = 60
bridge_fan_speed = 100
disable_fan_first_layers = 0
filament_density = 1.27
filament_diameter = 1.75
filament_retract_length = 1.2
filament_retract_speed = 40
filament_deretract_speed = 35
filament_max_volumetric_speed = 30
filament_colour = #DDDDDD
filament_notes = Higher speeds require higher temp to maintain flow - retraction needs to keep up with faster travel, stringing risk same as standard PETG - tune aggressively

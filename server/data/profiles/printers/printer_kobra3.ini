# PrusaSlicer Printer Profile — Anycubic Kobra 3 (Klipper)
# Build volume: 250x250x260mm, 0.4mm nozzle
# NOTE: G28, WIPE_NOZZLE, BED_MESH_CALIBRATE are handled by the print server
# via Moonraker API before starting the file. The firmware ignores these
# macros when they appear inside gcode files (sdcard print stream).

printer_model = Kobra3
printer_variant = 0.4
bed_shape = 0x0,250x0,250x250,0x250
max_print_height = 260
nozzle_diameter = 0.4
retract_length = 1.0
retract_speed = 30
retract_lift = 0.3
deretract_speed = 25
retract_before_wipe = 70%
wipe = 1
use_relative_e_distances = 1
use_firmware_retraction = 0
gcode_flavor = klipper
start_gcode = ; === START PRINT ===\n; NOTE: Homing, wipe, and leveling are done by print server via API\n; This gcode only handles heating and prime line\n;\n; Heat bed and wait\nM140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\n; Heat hotend to print temp and wait\nM109 S[first_layer_temperature]\n; Set pressure advance for PETG\nSET_PRESSURE_ADVANCE ADVANCE=0.04 SMOOTH_TIME=0.04\n; Prime line\nG92 E0\nG1 Z2 F3000\nG1 X2 Y10 F5000\nG1 Z0.28 F1500\nG1 X2 Y200 E15 F1500\nG1 X2.4 Y200 F5000\nG1 X2.4 Y10 E30 F1500\nG92 E0\nG1 Z2 F3000\nM117 Printing...
end_gcode = M104 S0\nM140 S0\nM106 S0\nG91\nG1 E-2 F2700\nG1 Z5 F3000\nG90\nG1 X0 Y250 F6000\nM84
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nSET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
layer_gcode =
max_layer_height = 0.32
min_layer_height = 0.08
printer_notes = Anycubic Kobra 3 with Rinkhals firmware exposing Moonraker

# PrusaSlicer Printer Profile — Creality Ender 3 S1 Pro (Klipper via MainsailOS)
# Build volume: 220x220x270mm, 0.4mm nozzle

printer_model = Ender3S1Pro
printer_variant = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 270
nozzle_diameter = 0.4
retract_length = 0.8
retract_speed = 50
retract_lift = 0.2
deretract_speed = 35
retract_before_wipe = 0%
use_relative_e_distances = 1
use_firmware_retraction = 0
gcode_flavor = klipper
start_gcode = G28\nM140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nBED_MESH_CALIBRATE\nM104 S[first_layer_temperature]\nM109 S[first_layer_temperature]\nG92 E0
end_gcode = M104 S0\nM140 S0\nG91\nG1 Z5 F3000\nG90\nG1 X0 Y220 F6000\nM84
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nSET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
layer_gcode =
max_layer_height = 0.32
min_layer_height = 0.08
printer_notes = Ender 3 S1 Pro running Klipper via MainsailOS on Raspberry Pi 3B+

# PrusaSlicer Printer Profile — Anycubic Kobra 3 V2 (Klipper)
# Build volume: 255x255x260mm, 0.4mm nozzle

printer_model = Kobra3V2
printer_variant = 0.4
bed_shape = 0x0,255x0,255x255,0x255
max_print_height = 260
nozzle_diameter = 0.4
retract_length = 0.8
retract_speed = 60
retract_lift = 0.2
deretract_speed = 40
retract_before_wipe = 0%
use_relative_e_distances = 1
use_firmware_retraction = 0
gcode_flavor = klipper
start_gcode = G28\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0
end_gcode = M104 S0\nM140 S0\nG91\nG1 Z5 F3000\nG90\nG1 X0 Y255 F6000\nM84
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nSET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
layer_gcode =
max_layer_height = 0.32
min_layer_height = 0.08
printer_notes = Anycubic Kobra 3 V2 with Rinkhals firmware exposing Moonraker

# PrusaSlicer Printer Profile — Anycubic Kobra 3 V2 (Klipper)
# Build volume: 255x255x260mm, 0.4mm nozzle

printer_model = Kobra3V2
printer_variant = 0.4
bed_shape = 0x0,255x0,255x255,0x255
max_print_height = 260
nozzle_diameter = 0.4
retract_length = 1.0
retract_speed = 30
retract_lift = 0.3
deretract_speed = 25
retract_before_wipe = 70%
wipe = 1
use_relative_e_distances = 1
use_firmware_retraction = 0
gcode_flavor = klipper
start_gcode = ; === START PRINT: Heat Bed → Preheat Hotend → Home → Level → Wipe → Print ===\n; Step 1: Start heating bed, preheat hotend to 120 (below ooze temp)\nM140 S[first_layer_bed_temperature]\nM104 S120\n; Step 2: Wait for bed to reach temp (thermal expansion stabilizes)\nM190 S[first_layer_bed_temperature]\n; Step 3: Home all axes\nG28\n; Step 4: Bed mesh while bed is hot, hotend is cool (no ooze during probing)\nBED_MESH_CALIBRATE ADAPTIVE=1\n; Step 5: Nozzle wipe at preheat temp (cleans any cold residue)\nWIPE_NOZZLE\n; Step 6: Now heat hotend to full print temp\nM109 S[first_layer_temperature]\n; Step 7: Second wipe to clean any ooze from final heating\nSINGLE_WIPE_NOZZLE\n; Step 8: Set pressure advance for PETG\nSET_PRESSURE_ADVANCE ADVANCE=0.04 SMOOTH_TIME=0.04\n; Step 9: Prime line\nG92 E0\nG1 Z2 F3000\nG1 X2 Y10 F5000\nG1 Z0.28 F1500\nG1 X2 Y200 E15 F1500\nG1 X2.4 Y200 F5000\nG1 X2.4 Y10 E30 F1500\nG92 E0\nG1 Z2 F3000\nM117 Printing...
end_gcode = M104 S0\nM140 S0\nM106 S0\nG91\nG1 E-2 F2700\nG1 Z5 F3000\nG90\nG1 X0 Y255 F6000\nM84
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nSET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
layer_gcode =
max_layer_height = 0.32
min_layer_height = 0.08
printer_notes = Anycubic Kobra 3 V2 with Rinkhals firmware exposing Moonraker
